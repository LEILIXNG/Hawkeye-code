<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hawkeye Code</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e3e5e9;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #eff4ff;
    --success: #16803c;
    --success-soft: #ecfdf3;
    --danger: #d64545;
    --danger-soft: #fef2f2;
    --warning: #b45309;
    --warning-soft: #fffbeb;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #171a21;
      --border: #2a2e37;
      --text: #e8eaed;
      --text-muted: #9aa1ac;
      --text-faint: #6b7280;
      --primary: #5b8def;
      --primary-hover: #7ba3f2;
      --primary-soft: #16233d;
      --success: #34d399;
      --success-soft: #0f2b21;
      --danger: #f27272;
      --danger-soft: #3a1719;
      --warning: #fbbf24;
      --warning-soft: #3a2a0d;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 800px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header { margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .brand { display: flex; align-items: center; gap: 0.6rem; }
  .brand img { width: 1.7rem; height: 1.7rem; border-radius: 6px; flex-shrink: 0; }
  h1 { font-size: 1.5rem; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 1rem; display: flex; align-items: center; gap: 0.5rem; }
  h2 .step { display: inline-flex; align-items: center; justify-content: center; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
  h2.collapsible { cursor: pointer; user-select: none; }
  h2.collapsible .chevron { margin-left: auto; color: var(--text-faint); font-size: 0.75rem; transition: transform 0.15s; }
  h2.collapsible.collapsed { margin-bottom: 0; }
  h2.collapsible.collapsed .chevron { transform: rotate(-90deg); }
  #settings-body { overflow: hidden; }
  #settings-body.collapsed { display: none; }
  h3 { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 1.6rem 0 0.7rem; }
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.4rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin: 0.85rem 0 0.3rem; }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 0.5rem 0.65rem;
    box-sizing: border-box;
    font-size: 0.9rem;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); }
  input::placeholder { color: var(--text-faint); }
  button {
    padding: 0.5rem 1rem;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }
  button:hover { border-color: var(--text-faint); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  button.danger-btn { color: var(--danger); }
  button.danger-btn:hover { border-color: var(--danger); background: var(--danger-soft); }
  button.small { padding: 0.3rem 0.6rem; font-size: 0.78rem; }
  #lang-toggle { flex-shrink: 0; border-radius: 999px; }
  .row { display: flex; gap: 0.6rem; align-items: center; margin-top: 1rem; }
  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 1.6rem 1rem;
    text-align: center;
    cursor: pointer;
    background: var(--bg);
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone:hover { border-color: var(--primary); }
  .dropzone.dragover { border-color: var(--primary); background: var(--primary-soft); }
  .dropzone-icon { font-size: 1.6rem; display: block; margin-bottom: 0.4rem; opacity: 0.7; }
  .dropzone-text { font-size: 0.85rem; color: var(--text-muted); margin: 0; }
  .dropzone-text .link { color: var(--primary); font-weight: 600; }
  .dropzone-filename { font-size: 0.85rem; font-weight: 600; margin: 0.4rem 0 0; color: var(--text); }
  #status-msg, #settings-msg { font-size: 0.85rem; margin-top: 0.75rem; display: flex; align-items: center; gap: 0.4rem; min-height: 1.2rem; }
  #status-msg:empty, #settings-msg:empty { margin-top: 0; }
  .ok { color: var(--success); }
  .err { color: var(--danger); }
  .spinner {
    width: 0.8rem; height: 0.8rem; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--primary);
    animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  table { width: 100%; border-collapse: collapse; margin-top: 0.4rem; font-size: 0.85rem; }
  td, th { text-align: left; padding: 0.5rem 0.4rem; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.02em; }
  tbody tr:last-child td { border-bottom: none; }
  .empty-row td { color: var(--text-faint); text-align: center; padding: 1.2rem 0; font-size: 0.85rem; }
  .pill { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 999px; }
  .pill-done { background: var(--success-soft); color: var(--success); }
  .pill-failed { background: var(--danger-soft); color: var(--danger); }
  .pill-active { background: var(--success-soft); color: var(--success); }
  .pill-progress { background: var(--warning-soft); color: var(--warning); }
  a.report-link { display: inline-flex; align-items: center; gap: 0.3rem; margin-top: 0.9rem; color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
  a.report-link:hover { text-decoration: underline; }
  a { color: var(--primary); }
  .config-row-name { font-weight: 600; }
  .config-row-url { color: var(--text-muted); font-family: ui-monospace, monospace; font-size: 0.8rem; }
  tbody tr[data-scan-id] { cursor: pointer; }
  tbody tr[data-scan-id]:hover { background: var(--primary-soft); }
  tbody tr[data-scan-id].selected { background: var(--primary-soft); }
  #scan-detail { display: none; margin-top: 1.1rem; padding-top: 1.1rem; border-top: 1px solid var(--border); }
  .detail-header { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
  .detail-header h3 { margin: 0; text-transform: none; letter-spacing: normal; font-size: 0.95rem; color: var(--text); }
  .detail-header a { font-size: 0.8rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .detail-header a:hover { text-decoration: underline; }
  .detail-summary { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
  .stat-mini { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.4rem 0.7rem; font-size: 0.78rem; }
  .stat-mini b { font-size: 0.95rem; margin-right: 0.25rem; }
  .stat-mini.stat-yes b { color: var(--danger); }
  .stat-mini.stat-no b { color: var(--success); }
  .stat-mini.stat-uncertain b { color: var(--warning); }
  .filters { display: flex; gap: 0.4rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
  .filter-btn { font-family: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; padding: 0.3rem 0.7rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); }
  .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .finding-card { border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 0.5rem; padding: 0.3rem 0.7rem; background: var(--bg); }
  .finding-card[data-hidden] { display: none; }
  .finding-card summary { cursor: pointer; display: flex; gap: 0.5rem; align-items: center; padding: 0.45rem 0; list-style: none; flex-wrap: wrap; font-size: 0.82rem; }
  .finding-card summary::-webkit-details-marker { display: none; }
  .finding-card .card-body { padding: 0.4rem 0.1rem 0.5rem; line-height: 1.6; border-top: 1px solid var(--border); margin-top: 0.2rem; font-size: 0.82rem; }
  .finding-card .card-body p { margin: 0.35rem 0; }
  .badge { font-size: 0.7rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 999px; color: #fff; }
  .badge-yes { background: var(--danger); }
  .badge-no { background: var(--success); }
  .badge-uncertain { background: var(--warning); }
  .badge-failed { background: var(--text-muted); }
  .finding-location { font-family: ui-monospace, monospace; font-size: 0.8rem; }
  .finding-rule { font-size: 0.75rem; color: var(--text-faint); margin-left: auto; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo.png" alt="Hawkeye Code">
      <h1>Hawkeye Code</h1>
    </div>
    <button id="lang-toggle" class="small" type="button"></button>
  </header>

  <section>
    <h2><span class="step">1</span><span data-i18n="section1.heading"></span></h2>
    <div class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept=".zip" hidden>
      <span class="dropzone-icon">📦</span>
      <p class="dropzone-text"><span data-i18n="dropzone.prefix"></span><span class="link" data-i18n="dropzone.link"></span></p>
      <p class="dropzone-filename" id="dropzone-filename"></p>
    </div>
    <label data-i18n="upload.modelLabel"></label>
    <select id="scan-llm-select"></select>
    <div class="row">
      <button id="upload-btn" class="primary" data-i18n="upload.button"></button>
    </div>
    <p id="status-msg"></p>
    <a id="report-link" class="report-link" style="display:none" target="_blank" data-i18n="report.link"></a>
  </section>

  <section>
    <h2><span class="step">2</span><span data-i18n="section2.heading"></span></h2>
    <table id="history-table">
      <thead><tr>
        <th data-i18n="history.thProject"></th>
        <th data-i18n="history.thStatus"></th>
        <th data-i18n="history.thTime"></th>
        <th></th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div id="scan-detail">
      <div class="detail-header">
        <h3 id="detail-title"></h3>
        <a id="detail-open-link" target="_blank" data-i18n="detail.openLink"></a>
      </div>
      <div id="detail-body"></div>
    </div>
  </section>

  <section>
    <h2 class="collapsible" id="settings-toggle">
      <span class="step">3</span><span data-i18n="section3.heading"></span>
      <span class="chevron">▾</span>
    </h2>
    <div id="settings-body">
      <label data-i18n="settings.configName"></label>
      <input id="config-name" data-i18n-placeholder="settings.configNamePlaceholder">
      <label data-i18n="settings.template"></label>
      <select id="provider-template">
        <option value="" data-i18n="settings.templateCustom"></option>
        <option value="https://api.openai.com/v1">OpenAI</option>
        <option value="https://api.deepseek.com/v1">DeepSeek</option>
        <option value="https://open.bigmodel.cn/api/paas/v4">智谱 GLM</option>
        <option value="https://dashscope.aliyuncs.com/compatible-mode/v1" data-i18n="settings.optQwen"></option>
      </select>
      <label>Base URL</label>
      <input id="base-url" data-i18n-placeholder="settings.baseUrlPlaceholder">
      <label>API Key</label>
      <input id="api-key" type="password" placeholder="sk-...">
      <label data-i18n="settings.verifyModel"></label>
      <input id="verify-model" placeholder="gpt-4o-mini / glm-4-flash / deepseek-chat">
      <div class="row">
        <button id="test-btn" data-i18n="settings.testBtn"></button>
        <button id="save-btn" class="primary" data-i18n="settings.saveBtn"></button>
      </div>
      <p id="settings-msg"></p>

      <h3 data-i18n="settings.savedConfigs"></h3>
      <table id="config-table">
        <thead><tr>
          <th data-i18n="settings.thName"></th>
          <th>Base URL</th>
          <th data-i18n="settings.thModel"></th>
          <th data-i18n="settings.thStatus"></th>
          <th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

<script>
const $ = (id) => document.getElementById(id);

const I18N = {
  zh: {
    langToggle: "English",
    section1: { heading: "上传 zip 并扫描" },
    dropzone: { prefix: "拖拽 zip 文件到这里，或 ", link: "点击选择" },
    upload: { button: "上传并开始扫描", modelLabel: "扫描用的模型", useActive: "使用当前生效配置", noConfigs: "还没有保存 LLM 配置，先去下面第 3 步添加" },
    report: { link: "查看报告 →" },
    section2: { heading: "历史扫描" },
    history: {
      thProject: "项目", thStatus: "状态", thTime: "时间", view: "查看 →",
      empty: "还没有扫描记录，上传一个 zip 试试",
    },
    detail: {
      openLink: "在新窗口打开完整报告 →",
      loading: "加载中...",
      loadFailed: (msg) => `✕ 加载报告失败: ${msg}`,
      inProgress: (status) => `扫描还在进行中(${status})，完成后回来点这一行看结果`,
      failedNoInfo: "扫描失败，没有更多信息",
      noFindings: "没有候选发现",
    },
    section3: { heading: "LLM 供应商设置" },
    settings: {
      configName: "配置名称", configNamePlaceholder: "例如 我的 GLM / 备用 DeepSeek",
      template: "模板", templateCustom: "自定义", optQwen: "通义千问 (兼容模式)",
      baseUrlPlaceholder: "留空则使用官方 OpenAI 地址",
      verifyModel: "复核用模型名",
      testBtn: "测试连接", saveBtn: "保存为新配置",
      savedConfigs: "已保存的配置",
      thName: "名称", thModel: "模型", thStatus: "状态",
      empty: "还没有保存过配置", active: "使用中", enable: "启用", delete: "删除",
      officialOpenAI: "(官方 OpenAI)",
    },
    msg: {
      testing: "测试中...", connectOk: "✓ 连接成功",
      connectFail: (e) => `✕ 连接失败: ${e}`, requestFail: (e) => `✕ 请求失败: ${e}`,
      savedActivated: "✓ 已保存并启用", saveFail: (e) => `✕ 保存失败: ${e}`,
      switched: "✓ 已切换", switchFail: (e) => `✕ 切换失败: ${e}`,
      deleteFail: (e) => `✕ 删除失败: ${e}`,
      selectZipFirst: "请先选择一个 zip 文件", onlyZip: "只支持 .zip 文件",
      uploading: "上传中...", uploadFail: (e) => `✕ 失败: ${e}`,
      selectedFile: (name) => `已选择: ${name}`,
    },
    status: { ingesting: "解压中", scanning: "扫描中", verifying: "LLM 复核中", done: "扫描完成", failed: "扫描失败" },
    reachable: { yes: "可达", no: "不可达", uncertain: "不确定", failed: "复核失败" },
    filters: { all: "全部", yes: "可达", no: "不可达", uncertain: "不确定", failed: "复核失败" },
    stats: { reachable: "漏洞总数", safe: "安全数量", needsReview: "需要人工复查" },
    card: { rule: "规则说明:", confidence: "置信度:", reasoning: "判断依据:", exploit: "攻击场景:" },
  },
  en: {
    langToggle: "中文",
    section1: { heading: "Upload a zip & scan" },
    dropzone: { prefix: "Drag a zip file here, or ", link: "click to browse" },
    upload: { button: "Upload & start scan", modelLabel: "Model for this scan", useActive: "Use the currently active config", noConfigs: "No saved LLM configs yet — add one in step 3 below" },
    report: { link: "View report →" },
    section2: { heading: "Scan history" },
    history: {
      thProject: "Project", thStatus: "Status", thTime: "Time", view: "View →",
      empty: "No scans yet — upload a zip to get started",
    },
    detail: {
      openLink: "Open full report in new tab →",
      loading: "Loading...",
      loadFailed: (msg) => `✕ Failed to load report: ${msg}`,
      inProgress: (status) => `Scan still in progress (${status}) — come back to this row once it's done`,
      failedNoInfo: "Scan failed, no further details",
      noFindings: "No candidate findings",
    },
    section3: { heading: "LLM provider settings" },
    settings: {
      configName: "Config name", configNamePlaceholder: "e.g. My GLM / Backup DeepSeek",
      template: "Template", templateCustom: "Custom", optQwen: "Tongyi Qianwen (compatible mode)",
      baseUrlPlaceholder: "Leave blank to use the official OpenAI endpoint",
      verifyModel: "Verification model name",
      testBtn: "Test connection", saveBtn: "Save as new config",
      savedConfigs: "Saved configs",
      thName: "Name", thModel: "Model", thStatus: "Status",
      empty: "No saved configs yet", active: "Active", enable: "Enable", delete: "Delete",
      officialOpenAI: "(Official OpenAI)",
    },
    msg: {
      testing: "Testing...", connectOk: "✓ Connected successfully",
      connectFail: (e) => `✕ Connection failed: ${e}`, requestFail: (e) => `✕ Request failed: ${e}`,
      savedActivated: "✓ Saved and activated", saveFail: (e) => `✕ Save failed: ${e}`,
      switched: "✓ Switched", switchFail: (e) => `✕ Switch failed: ${e}`,
      deleteFail: (e) => `✕ Delete failed: ${e}`,
      selectZipFirst: "Please choose a zip file first", onlyZip: "Only .zip files are supported",
      uploading: "Uploading...", uploadFail: (e) => `✕ Failed: ${e}`,
      selectedFile: (name) => `Selected: ${name}`,
    },
    status: { ingesting: "Extracting", scanning: "Scanning", verifying: "LLM verifying", done: "Scan complete", failed: "Scan failed" },
    reachable: { yes: "Reachable", no: "Not reachable", uncertain: "Uncertain", failed: "Verify failed" },
    filters: { all: "All", yes: "Reachable", no: "Not reachable", uncertain: "Uncertain", failed: "Failed" },
    stats: { reachable: "Vulnerabilities found", safe: "Safe count", needsReview: "Needs manual review" },
    card: { rule: "Rule:", confidence: "Confidence:", reasoning: "Reasoning:", exploit: "Exploit scenario:" },
  },
};

let lang = localStorage.getItem("hawkeye-lang") || "zh";
const t = (path) => path.split(".").reduce((o, k) => (o ? o[k] : undefined), I18N[lang]);

function applyStaticI18n() {
  document.documentElement.lang = lang === "zh" ? "zh" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const val = t(el.dataset.i18n);
    if (typeof val === "string") el.textContent = val;
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    const val = t(el.dataset.i18nPlaceholder);
    if (typeof val === "string") el.placeholder = val;
  });
  $("lang-toggle").textContent = t("langToggle");
}

async function api(path, options) {
  const resp = await fetch(path, options);
  const text = await resp.text();
  const isJson = resp.headers.get("content-type")?.includes("application/json");
  // A 204 (e.g. DELETE) still carries a JSON content-type header but an
  // empty body -- JSON.parse("") throws, so only parse when there's
  // actually something to parse.
  const body = isJson && text ? JSON.parse(text) : null;
  if (!resp.ok) throw new Error(body?.detail || resp.statusText);
  return body;
}

function setMsg(el, text, kind) {
  el.className = kind || "";
  el.innerHTML = kind === "" && text ? `<span class="spinner"></span>${text}` : text;
}

$("lang-toggle").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem("hawkeye-lang", lang);
  applyStaticI18n();
  loadConfigList();
  loadHistory();
});

function setSettingsCollapsed(collapsed) {
  $("settings-toggle").classList.toggle("collapsed", collapsed);
  $("settings-body").classList.toggle("collapsed", collapsed);
}
setSettingsCollapsed(localStorage.getItem("hawkeye-settings-collapsed") === "1");
$("settings-toggle").addEventListener("click", () => {
  const collapsed = !$("settings-body").classList.contains("collapsed");
  setSettingsCollapsed(collapsed);
  localStorage.setItem("hawkeye-settings-collapsed", collapsed ? "1" : "0");
});

$("provider-template").addEventListener("change", (e) => {
  $("base-url").value = e.target.value;
});

$("test-btn").addEventListener("click", async () => {
  const msg = $("settings-msg");
  setMsg(msg, t("msg.testing"), "");
  try {
    const result = await api("/settings/llm/test", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        base_url: $("base-url").value || null,
        api_key: $("api-key").value,
        verify_model: $("verify-model").value,
      }),
    });
    setMsg(msg, result.success ? t("msg.connectOk") : t("msg.connectFail")(result.error), result.success ? "ok" : "err");
  } catch (e) {
    setMsg(msg, t("msg.requestFail")(e.message), "err");
  }
});

$("save-btn").addEventListener("click", async () => {
  const msg = $("settings-msg");
  try {
    await api("/settings/llm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: $("config-name").value || "default",
        base_url: $("base-url").value || null,
        api_key: $("api-key").value,
        verify_model: $("verify-model").value,
      }),
    });
    setMsg(msg, t("msg.savedActivated"), "ok");
    loadConfigList();
  } catch (e) {
    setMsg(msg, t("msg.saveFail")(e.message), "err");
  }
});

async function loadActiveConfig() {
  try {
    const cfg = await api("/settings/llm");
    if (!cfg) return;
    $("base-url").value = cfg.base_url || "";
    $("verify-model").value = cfg.verify_model || "";
  } catch (e) { /* ignore */ }
}

function renderScanLlmSelect(configs) {
  const select = $("scan-llm-select");
  const previousValue = select.value;
  select.innerHTML = "";
  if (configs.length === 0) {
    select.innerHTML = `<option value="">${t("upload.noConfigs")}</option>`;
    select.disabled = true;
    return;
  }
  select.disabled = false;
  const activeOption = document.createElement("option");
  activeOption.value = "";
  activeOption.textContent = t("upload.useActive");
  select.appendChild(activeOption);
  for (const cfg of configs) {
    const opt = document.createElement("option");
    opt.value = cfg.id;
    opt.textContent = `${cfg.name} (${cfg.verify_model})`;
    select.appendChild(opt);
  }
  // Keep whatever the user had picked across a language switch / list refresh,
  // as long as that config still exists.
  if ([...select.options].some((o) => o.value === previousValue)) select.value = previousValue;
}

async function loadConfigList() {
  const msg = $("settings-msg");
  const tbody = document.querySelector("#config-table tbody");
  tbody.innerHTML = "";
  const configs = await api("/settings/llm/list");
  renderScanLlmSelect(configs);
  if (configs.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="5">${t("settings.empty")}</td></tr>`;
    return;
  }
  for (const cfg of configs) {
    const tr = document.createElement("tr");
    const statusCell = cfg.is_active
      ? `<span class="pill pill-active">${t("settings.active")}</span>`
      : `<button class="small" data-activate="${cfg.id}">${t("settings.enable")}</button>`;
    tr.innerHTML = `
      <td class="config-row-name">${esc(cfg.name)}</td>
      <td class="config-row-url">${esc(cfg.base_url) || t("settings.officialOpenAI")}</td>
      <td>${esc(cfg.verify_model)}</td>
      <td>${statusCell}</td>
      <td><button class="small danger-btn" data-delete="${cfg.id}">${t("settings.delete")}</button></td>`;
    tbody.appendChild(tr);
  }

  tbody.querySelectorAll("[data-activate]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await api(`/settings/llm/${btn.dataset.activate}/activate`, { method: "POST" });
        setMsg(msg, t("msg.switched"), "ok");
        loadActiveConfig();
        loadConfigList();
      } catch (e) {
        setMsg(msg, t("msg.switchFail")(e.message), "err");
      }
    });
  });

  tbody.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await api(`/settings/llm/${btn.dataset.delete}`, { method: "DELETE" });
        loadActiveConfig();
        loadConfigList();
      } catch (e) {
        setMsg(msg, t("msg.deleteFail")(e.message), "err");
      }
    });
  });
}

const dropzone = $("dropzone");
const fileInput = $("file-input");
const dropzoneFilename = $("dropzone-filename");

// Without this, dropping a file anywhere outside the dropzone makes the
// browser navigate to/open the file instead of doing nothing.
["dragover", "drop"].forEach((evt) => {
  window.addEventListener(evt, (e) => { if (e.target !== dropzone) e.preventDefault(); });
});

function setSelectedFile(file) {
  if (!file) return;
  if (!file.name.toLowerCase().endsWith(".zip")) {
    setMsg($("status-msg"), t("msg.onlyZip"), "err");
    return;
  }
  const dt = new DataTransfer();
  dt.items.add(file);
  fileInput.files = dt.files;
  dropzoneFilename.textContent = t("msg.selectedFile")(file.name);
  setMsg($("status-msg"), "", "");
}

dropzone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => setSelectedFile(fileInput.files[0]));

["dragenter", "dragover"].forEach((evt) => {
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.add("dragover");
  });
});
["dragleave", "dragend"].forEach((evt) => {
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.remove("dragover");
  });
});
dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  setSelectedFile(e.dataTransfer.files[0]);
});

$("upload-btn").addEventListener("click", async () => {
  const statusMsg = $("status-msg");
  const reportLink = $("report-link");
  const uploadBtn = $("upload-btn");
  reportLink.style.display = "none";
  const file = $("file-input").files[0];
  if (!file) { setMsg(statusMsg, t("msg.selectZipFirst"), "err"); return; }

  uploadBtn.disabled = true;
  try {
    setMsg(statusMsg, t("msg.uploading"), "");
    const form = new FormData();
    form.append("file", file);
    const project = await api("/uploads", { method: "POST", body: form });

    const scan = await api("/scans", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ project_id: project.id, llm_config_id: $("scan-llm-select").value || null }),
    });

    await pollScan(scan.id, statusMsg, reportLink);
    loadHistory();
    fileInput.value = "";
    dropzoneFilename.textContent = "";
  } catch (e) {
    setMsg(statusMsg, t("msg.uploadFail")(e.message), "err");
  } finally {
    uploadBtn.disabled = false;
  }
});

function statusLabel(status) {
  return t(`status.${status}`) || status;
}

async function pollScan(scanId, statusMsg, reportLink) {
  while (true) {
    const scan = await api(`/scans/${scanId}`);
    const label = statusLabel(scan.status);
    if (scan.status === "done") {
      setMsg(statusMsg, `✓ ${label}`, "ok");
      reportLink.href = `/scans/${scanId}/report.html`;
      reportLink.style.display = "inline-flex";
      return;
    }
    if (scan.status === "failed") {
      setMsg(statusMsg, `✕ ${label}${scan.error_message ? `: ${scan.error_message}` : ""}`, "err");
      return;
    }
    setMsg(statusMsg, label, "");
    await new Promise((r) => setTimeout(r, 2000));
  }
}

async function loadHistory() {
  const tbody = document.querySelector("#history-table tbody");
  tbody.innerHTML = "";
  $("scan-detail").style.display = "none";
  const projects = await api("/projects");
  const rows = [];
  for (const project of projects) {
    const scans = await api(`/projects/${project.id}/scans`);
    for (const scan of scans) rows.push({ project, scan });
  }
  if (rows.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="4">${t("history.empty")}</td></tr>`;
    return;
  }
  for (const { project, scan } of rows) {
    const tr = document.createElement("tr");
    tr.dataset.scanId = scan.id;
    const pillClass = scan.status === "done" ? "pill-done" : scan.status === "failed" ? "pill-failed" : "pill-progress";
    const statusPill = `<span class="pill ${pillClass}">${statusLabel(scan.status)}</span>`;
    tr.innerHTML = `<td>${esc(project.name)}</td><td>${statusPill}</td><td>${esc(scan.started_at ?? "")}</td><td>${t("history.view")}</td>`;
    tr.addEventListener("click", () => selectScan(tr, project, scan));
    tbody.appendChild(tr);
  }
}

function esc(s) {
  // Rule messages/paths are trusted, but LLM `reasoning`/`exploit_scenario`
  // text can echo back snippets of the scanned (untrusted) source code, so
  // everything from a finding gets escaped before going into innerHTML.
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function findingCardHtml(item) {
  const finding = item.finding || {};
  const reachable = finding.reachable || "uncertain";
  const isFailed = (finding.reasoning || "").includes("verifier_failed");
  const bucket = isFailed ? "failed" : reachable;
  const badgeClass = isFailed ? "badge-failed" : { yes: "badge-yes", no: "badge-no" }[reachable] || "badge-uncertain";
  const badgeLabel = isFailed ? t("reachable.failed") : (t(`reachable.${reachable}`) || reachable);
  const ruleIds = (item.rule_ids || [item.rule_id || ""]).join(", ");
  const messages = (item.messages || [item.message || ""]).join(" / ");
  const exploit = finding.exploit_scenario
    ? `<p><strong>${t("card.exploit")}</strong> ${esc(finding.exploit_scenario)}</p>` : "";
  const confidence = finding.confidence != null
    ? `<p><strong>${t("card.confidence")}</strong> ${esc(finding.confidence)}</p>` : "";
  return `
    <details class="finding-card" data-bucket="${esc(bucket)}">
      <summary>
        <span class="badge ${badgeClass}">${badgeLabel}</span>
        <span>${esc(item.severity)}</span>
        <span class="finding-location">${esc(item.sink_file)}:${esc(item.sink_line)}</span>
        <span class="finding-rule">${esc(ruleIds)}</span>
      </summary>
      <div class="card-body">
        <p><strong>${t("card.rule")}</strong> ${esc(messages)}</p>
        <p><strong>CWE:</strong> ${esc(item.cwe || "-")} &nbsp;·&nbsp; <strong>Source:</strong> ${esc(item.source_file)}:${esc(item.source_line)}</p>
        ${confidence}
        <p><strong>${t("card.reasoning")}</strong> ${esc(finding.reasoning)}</p>
        ${exploit}
      </div>
    </details>`;
}

async function selectScan(tr, project, scan) {
  document.querySelectorAll("#history-table tr.selected").forEach((el) => el.classList.remove("selected"));
  tr.classList.add("selected");

  const detail = $("scan-detail");
  const title = $("detail-title");
  const openLink = $("detail-open-link");
  const body = $("detail-body");
  detail.style.display = "block";
  title.textContent = `${project.name} — ${statusLabel(scan.status)}`;

  if (scan.status === "failed") {
    openLink.style.display = "none";
    body.innerHTML = `<p class="err" style="font-size:0.85rem">✕ ${esc(scan.error_message || t("detail.failedNoInfo"))}</p>`;
    return;
  }
  if (scan.status !== "done") {
    openLink.style.display = "none";
    body.innerHTML = `<p style="font-size:0.85rem;color:var(--text-muted)"><span class="spinner"></span> ${t("detail.inProgress")(statusLabel(scan.status))}</p>`;
    return;
  }

  openLink.style.display = "inline";
  openLink.href = `/scans/${scan.id}/report.html`;
  body.innerHTML = `<p style="font-size:0.85rem;color:var(--text-muted)"><span class="spinner"></span> ${t("detail.loading")}</p>`;
  try {
    const report = await api(`/scans/${scan.id}/report.json`);
    const s = report.summary;
    const needsReview = s.uncertain + s.verifier_failed;
    const statHtml = [
      [s.reachable, "stats.reachable", "stat-yes"],
      [s.not_reachable, "stats.safe", "stat-no"],
      [needsReview, "stats.needsReview", "stat-uncertain"],
    ].map(([value, labelKey, cls]) => `<span class="stat-mini ${cls}"><b>${value}</b>${t(labelKey)}</span>`).join("");
    const filterHtml = ["all", "yes", "no", "uncertain", "failed"].map((key, i) =>
      `<button class="filter-btn${i === 0 ? " active" : ""}" data-filter="${key}">${t(`filters.${key}`)}</button>`).join("");
    const cardsHtml = report.findings.length
      ? report.findings.map(findingCardHtml).join("")
      : `<p style="font-size:0.85rem;color:var(--text-faint)">${t("detail.noFindings")}</p>`;
    body.innerHTML = `
      <div class="detail-summary">${statHtml}</div>
      <div class="filters">${filterHtml}</div>
      <div id="detail-cards">${cardsHtml}</div>`;

    const cards = Array.from(body.querySelectorAll(".finding-card"));
    body.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        body.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        cards.forEach((card) => {
          const show = btn.dataset.filter === "all" || card.dataset.bucket === btn.dataset.filter;
          if (show) card.removeAttribute("data-hidden"); else card.setAttribute("data-hidden", "");
        });
      });
    });
  } catch (e) {
    body.innerHTML = `<p class="err" style="font-size:0.85rem">${t("detail.loadFailed")(e.message)}</p>`;
  }
}

applyStaticI18n();
loadActiveConfig();
loadConfigList();
loadHistory();
</script>
</body>
