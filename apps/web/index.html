<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hawkeye Code</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e3e5e9;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #eff4ff;
    --success: #16803c;
    --success-soft: #ecfdf3;
    --danger: #d64545;
    --danger-soft: #fef2f2;
    --warning: #b45309;
    --warning-soft: #fffbeb;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #171a21;
      --border: #2a2e37;
      --text: #e8eaed;
      --text-muted: #9aa1ac;
      --text-faint: #6b7280;
      --primary: #5b8def;
      --primary-hover: #7ba3f2;
      --primary-soft: #16233d;
      --success: #34d399;
      --success-soft: #0f2b21;
      --danger: #f27272;
      --danger-soft: #3a1719;
      --warning: #fbbf24;
      --warning-soft: #3a2a0d;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 1160px;
    margin: 0 auto;
    padding: 1.4rem 1.1rem 3.2rem;
    background:
      radial-gradient(circle at top left, rgba(31, 94, 255, 0.11), transparent 32%),
      radial-gradient(circle at top right, rgba(15, 125, 66, 0.08), transparent 30%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1rem;
    padding: 1.2rem 1.25rem;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: linear-gradient(180deg, var(--bg-accent), var(--surface));
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .brand img { width: 2.35rem; height: 2.35rem; border-radius: 10px; flex-shrink: 0; box-shadow: 0 6px 16px rgba(31, 94, 255, 0.16); }
  .brand-text { display: flex; flex-direction: column; gap: 0.2rem; }
  .eyebrow {
    margin: 0;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-weight: 700;
  }
  .hero-subtitle {
    margin: 0.55rem 0 0;
    max-width: 56rem;
    color: var(--text-muted);
    font-size: 0.95rem;
  }
  .hero-metrics { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.95rem; }
  .metric-chip {
    display: inline-flex;
    flex-direction: column;
    gap: 0.15rem;
    min-width: 8.5rem;
    padding: 0.7rem 0.85rem;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface-strong);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4) inset;
  }
  .metric-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; color: var(--text-faint); text-transform: uppercase; }
  .metric-value { font-size: 1rem; font-weight: 700; color: var(--text); }
  h1 { font-size: 1.55rem; font-weight: 700; margin: 0; letter-spacing: -0.02em; line-height: 1.1; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 1rem; display: flex; align-items: center; gap: 0.5rem; }
  h2 .step { display: inline-flex; align-items: center; justify-content: center; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
  h2.collapsible { cursor: pointer; user-select: none; }
  h2.collapsible .chevron { margin-left: auto; color: var(--text-faint); font-size: 0.75rem; transition: transform 0.15s; }
  h2.collapsible.collapsed { margin-bottom: 0; }
  h2.collapsible.collapsed .chevron { transform: rotate(-90deg); }
  #settings-body { overflow: hidden; }
  #settings-body.collapsed { display: none; }
  h3 { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 1.6rem 0 0.7rem; }
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.4rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin: 0.85rem 0 0.3rem; }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 0.5rem 0.65rem;
    box-sizing: border-box;
    font-size: 0.9rem;
    background:
      radial-gradient(circle at top left, rgba(31, 94, 255, 0.11), transparent 32%),
      radial-gradient(circle at top right, rgba(15, 125, 66, 0.08), transparent 30%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); }
  input::placeholder { color: var(--text-faint); }
  button {
    padding: 0.5rem 1rem;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }
  button:hover { border-color: var(--text-faint); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  button.danger-btn { color: var(--danger); }
  button.danger-btn:hover { border-color: var(--danger); background: var(--danger-soft); }
  button.small { padding: 0.3rem 0.6rem; font-size: 0.78rem; }
  #lang-toggle { flex-shrink: 0; border-radius: 999px; }
  .field-hint { font-size: 0.75rem; color: var(--text-faint); margin: 0.3rem 0 0; line-height: 1.4; }
  .row { display: flex; gap: 0.6rem; align-items: center; margin-top: 1rem; }
  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 1.6rem 1rem;
    text-align: center;
    cursor: pointer;
    background:
      radial-gradient(circle at top left, rgba(31, 94, 255, 0.11), transparent 32%),
      radial-gradient(circle at top right, rgba(15, 125, 66, 0.08), transparent 30%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone:hover { border-color: var(--primary); }
  .dropzone.dragover { border-color: var(--primary); background: var(--primary-soft); }
  .dropzone-icon { font-size: 1.6rem; display: block; margin-bottom: 0.4rem; opacity: 0.7; }
  .dropzone-text { font-size: 0.85rem; color: var(--text-muted); margin: 0; }
  .dropzone-text .link { color: var(--primary); font-weight: 600; }
  .dropzone-filename { font-size: 0.85rem; font-weight: 600; margin: 0.4rem 0 0; color: var(--text); }
  #status-msg, #settings-msg { font-size: 0.85rem; margin-top: 0.75rem; display: flex; align-items: center; gap: 0.4rem; min-height: 1.2rem; }
  #status-msg:empty, #settings-msg:empty { margin-top: 0; }
  .ok { color: var(--success); }
  .err { color: var(--danger); }
  .spinner {
    width: 0.8rem; height: 0.8rem; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--primary);
    animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Named pstep-*, not step-*: `.step` is already the numbered badge in the
     <h2> section headings, and reusing it here made those badges flex to
     the full width of the heading. */
  .stepper { display: flex; align-items: flex-start; }
  .pstep { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.35rem; position: relative; }
  /* The connector is drawn by each step except the first, reaching back to
     the previous one, so it never overhangs the ends of the row. */
  .pstep:not(:first-child)::before {
    content: ""; position: absolute; height: 2px; background: var(--border);
    top: 0.65rem; right: 50%; left: -50%; z-index: 0;
  }
  .pstep.done::before, .pstep.active::before { background: var(--primary); }
  .pstep.failed::before { background: var(--danger); }
  .pstep-dot {
    width: 1.3rem; height: 1.3rem; border-radius: 50%; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; background: var(--surface);
    border: 2px solid var(--border); color: var(--text-faint);
  }
  .pstep.done .pstep-dot { background: var(--primary); border-color: var(--primary); color: #fff; }
  .pstep.active .pstep-dot { border-color: var(--primary); color: var(--primary); }
  .pstep.failed .pstep-dot { background: var(--danger); border-color: var(--danger); color: #fff; }
  .pstep-label { font-size: 0.72rem; color: var(--text-faint); text-align: center; line-height: 1.3; }
  .pstep.done .pstep-label, .pstep.active .pstep-label { color: var(--text); }
  .pstep.active .pstep-label { font-weight: 600; }
  .pstep.failed .pstep-label { color: var(--danger); font-weight: 600; }
  .pstep-elapsed { font-size: 0.7rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .pbar { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; margin: 0.85rem 0 0.5rem; }
  .pbar-fill { height: 100%; width: 0; border-radius: 999px; background: var(--primary); transition: width 0.45s ease; }
  .pbar-fill.done { background: var(--success); }
  .pbar-fill.failed { background: var(--danger); }
  .pstep-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; }
  .pstep-meta .pstep-elapsed:last-child { text-align: right; }
  .task-log { margin-top: 1.1rem; border-top: 1px solid var(--border); padding-top: 0.75rem; }
  .task-log-head {
    display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none;
    font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
  }
  .task-log-head .chevron { margin-left: auto; color: var(--text-faint); font-size: 0.75rem; transition: transform 0.15s; }
  .task-log-head.collapsed .chevron { transform: rotate(-90deg); }
  .task-log.collapsed #log-body { display: none; }
  #log-body {
    margin: 0.4rem 0 0; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text-muted); max-height: 20rem; overflow: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.72rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #log-body .log-empty { color: var(--text-faint); }
  table { width: 100%; border-collapse: collapse; margin-top: 0.4rem; font-size: 0.85rem; }
  td, th { text-align: left; padding: 0.5rem 0.4rem; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.02em; }
  tbody tr:last-child td { border-bottom: none; }
  .empty-row td { color: var(--text-faint); text-align: center; padding: 1.2rem 0; font-size: 0.85rem; }
  .pill { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 999px; }
  .pill-done { background: var(--success-soft); color: var(--success); }
  .pill-failed { background: var(--danger-soft); color: var(--danger); }
  .pill-active { background: var(--success-soft); color: var(--success); }
  .pill-progress { background: var(--warning-soft); color: var(--warning); }
  .risk-critical { background: var(--danger); color: #fff; }
  .risk-high { background: var(--danger-soft); color: var(--danger); }
  .risk-medium { background: var(--warning-soft); color: var(--warning); }
  .risk-low { background: var(--border); color: var(--text-muted); }
  .cvss { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .detail-actions { display: flex; align-items: baseline; gap: 0.9rem; flex-wrap: wrap; }
  a { color: var(--primary); }
  .config-row-name { font-weight: 600; }
  .config-row-url { color: var(--text-muted); font-family: ui-monospace, monospace; font-size: 0.8rem; }
  tbody tr[data-scan-id] { cursor: pointer; }
  tbody tr[data-scan-id]:hover { background: var(--primary-soft); }
  tbody tr[data-scan-id].selected { background: var(--primary-soft); }
  #scan-detail { display: none; margin-top: 1.1rem; padding-top: 1.1rem; border-top: 1px solid var(--border); }
  .detail-header { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
  .detail-header h3 { margin: 0; text-transform: none; letter-spacing: normal; font-size: 0.95rem; color: var(--text); }
  .detail-header a { font-size: 0.8rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .detail-header a:hover { text-decoration: underline; }
  .detail-summary { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
  .stat-mini { background:
      radial-gradient(circle at top left, rgba(31, 94, 255, 0.11), transparent 32%),
      radial-gradient(circle at top right, rgba(15, 125, 66, 0.08), transparent 30%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.4rem 0.7rem; font-size: 0.78rem; }
  .stat-mini b { font-size: 0.95rem; margin-right: 0.25rem; }
  .stat-mini.stat-yes b { color: var(--danger); }
  .stat-mini.stat-no b { color: var(--success); }
  .stat-mini.stat-uncertain b { color: var(--warning); }
  .filters { display: flex; gap: 0.4rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
  .filter-btn { font-family: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; padding: 0.3rem 0.7rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); }
  .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .finding-card { border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 0.5rem; padding: 0.3rem 0.7rem; background:
      radial-gradient(circle at top left, rgba(31, 94, 255, 0.11), transparent 32%),
      radial-gradient(circle at top right, rgba(15, 125, 66, 0.08), transparent 30%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%); }
  .finding-card[data-hidden] { display: none; }
  .finding-card summary { cursor: pointer; display: flex; gap: 0.5rem; align-items: center; padding: 0.45rem 0; list-style: none; flex-wrap: wrap; font-size: 0.82rem; }
  .finding-card summary::-webkit-details-marker { display: none; }
  .finding-card .card-body { padding: 0.4rem 0.1rem 0.5rem; line-height: 1.6; border-top: 1px solid var(--border); margin-top: 0.2rem; font-size: 0.82rem; }
  .finding-card .card-body p { margin: 0.35rem 0; }
  .finding-card .card-body p.remediation { border-left: 3px solid var(--primary); padding: 0.35rem 0 0.35rem 0.6rem;
                                           background: var(--primary-soft); border-radius: 0 4px 4px 0; }
  .badge { font-size: 0.7rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 999px; color: #fff; }
  .badge-yes { background: var(--danger); }
  .badge-no { background: var(--success); }
  .badge-uncertain { background: var(--warning); }
  .badge-failed { background: var(--text-muted); }
  .finding-location { font-family: ui-monospace, monospace; font-size: 0.8rem; }
  .finding-rule { font-size: 0.75rem; color: var(--text-faint); margin-left: auto; }
  /* Logo-led visual system: obsidian, warm mineral white, and a precise amber signal. */
  :root {
    --bg: #f1efe8; --surface: #faf9f5; --surface-strong: #fffefa;
    --border: #d9d5ca; --border-strong: #b8b3a7; --text: #171918;
    --text-muted: #6f716c; --text-faint: #9b9b93; --primary: #191b1b;
    --primary-hover: #050606; --primary-soft: #efede6; --accent: #df7900;
    --accent-soft: #fff0dc; --success: #4b6655; --success-soft: #e8eee9;
    --danger: #aa5548; --danger-soft: #f5e7e3; --warning: #a76a19;
    --warning-soft: #f8eddc; --radius: 12px; --radius-sm: 8px;
    --shadow: 0 18px 48px rgba(18,20,19,.055), 0 2px 8px rgba(18,20,19,.035);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #111312; --surface: #191b1a; --surface-strong: #202220;
    --border: #343631; --border-strong: #555750; --text: #f3f1ea;
    --text-muted: #b0b0a9; --text-faint: #797b75; --primary: #f1eee5;
    --primary-hover: #ffffff; --primary-soft: #292a26; --accent: #f18a11;
    --accent-soft: #3b2a17; --success: #91ad9b; --success-soft: #26342b;
    --danger: #e59b8f; --danger-soft: #3d2926; --warning: #e5b56e;
    --warning-soft: #3b3020; --shadow: 0 18px 48px rgba(0,0,0,.24), 0 2px 8px rgba(0,0,0,.18);
  }}
  html { background: var(--bg); }
  body {
    max-width: 1180px; padding: 2.4rem clamp(1rem,4vw,3.75rem) 5rem;
    background: radial-gradient(circle at 5% 0%, rgba(223,121,0,.045), transparent 24rem), linear-gradient(180deg,var(--bg),var(--bg));
    color: var(--text); font-family: "Avenir Next",Avenir,"Segoe UI Variable","PingFang SC","Microsoft YaHei",sans-serif; line-height: 1.55;
  }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .32; background-image: linear-gradient(rgba(23,25,24,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(23,25,24,.022) 1px,transparent 1px); background-size: 32px 32px; mask-image: linear-gradient(to bottom,black,transparent 72%); }
  header { position: relative; align-items: center; margin-bottom: 2.2rem; padding: 0 0 1.55rem; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: transparent; box-shadow: none; backdrop-filter: none; }
  .brand { gap: .95rem; } .brand img { width: 3rem; height: 3rem; border-radius: 12px; box-shadow: 0 10px 24px rgba(8,10,9,.18); }
  h1 { font-size: clamp(1.35rem,2vw,1.65rem); letter-spacing: -.035em; }
  #lang-toggle { padding: .55rem .8rem; border-color: var(--border); background: transparent; color: var(--text-muted); }
  #lang-toggle:hover { background: var(--surface-strong); border-color: var(--border-strong); color: var(--text); }
  #lang-toggle:focus-visible, button:focus-visible, .dropzone:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  section { position: relative; margin-bottom: 1.15rem; padding: clamp(1.2rem,2.4vw,1.85rem); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
  h2 { margin: 0 0 1.35rem; gap: .7rem; font-size: .97rem; letter-spacing: -.01em; }
  h2 .step { width: 1.55rem; height: 1.55rem; border: 1px solid #c8c4b9; border-radius: 8px; background: var(--primary-soft); color: var(--text); font-size: .68rem; }
  h2.collapsible { margin-bottom: 1.35rem; } h2.collapsible.collapsed { margin-bottom: 0; }
  h2.collapsible .chevron { width: 1.3rem; height: 1.3rem; border: 1px solid var(--border); border-radius: 50%; font-size: 0; display: inline-flex; align-items: center; justify-content: center; }
  h2.collapsible .chevron::before { content: ""; width: .42rem; height: .42rem; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); }
  h2.collapsible.collapsed .chevron::before { transform: translateY(2px) rotate(225deg); }
  label { margin: 1.15rem 0 .42rem; color: var(--text); font-size: .73rem; font-weight: 700; letter-spacing: .035em; }
  label:first-of-type { margin-top: 0; }
  input, select { min-height: 2.65rem; padding: .68rem .8rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-strong); color: var(--text); box-shadow: 0 1px 1px rgba(35,39,33,.03); }
  input:hover, select:hover { border-color: var(--border-strong); }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(223,121,0,.13); }
  .row { gap: .65rem; margin-top: 1.3rem; flex-wrap: wrap; }
  button { min-height: 2.5rem; padding: .62rem .95rem; border-radius: var(--radius-sm); border-color: var(--border); background: var(--surface-strong); font-size: .8rem; letter-spacing: .005em; }
  button:hover { border-color: var(--border-strong); background: var(--surface); }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--surface-strong); box-shadow: 0 8px 18px rgba(10,12,11,.13); }

let lang = localStorage.getItem("hawkeye-lang") || "zh";
const t = (path) => path.split(".").reduce((o, k) => (o ? o[k] : undefined), I18N[lang]);

function applyStaticI18n() {
  document.documentElement.lang = lang === "zh" ? "zh" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const val = t(el.dataset.i18n);
    if (typeof val === "string") el.textContent = val;
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    const val = t(el.dataset.i18nPlaceholder);
    if (typeof val === "string") el.placeholder = val;
  });
  document.querySelectorAll("[data-text-zh]").forEach((el) => {
    const val = lang === "zh" ? el.dataset.textZh : el.dataset.textEn;
    if (typeof val === "string") el.textContent = val;
  });
  $("lang-toggle").textContent = t("langToggle");
  // The Markdown export is rendered server-side in one language, so its
  // href carries the current one. Written when a scan is selected, but the
  // reader can switch language after that and expects the export to follow.
  document.querySelectorAll('a[href*="format=md"]').forEach((a) => {
    a.setAttribute("href", a.getAttribute("href").replace(/lang=[a-z-]+/, `lang=${lang}`));
  });
}

async function api(path, options) {
  const resp = await fetch(path, options);
  const text = await resp.text();
  const isJson = resp.headers.get("content-type")?.includes("application/json");
  // A 204 (e.g. DELETE) still carries a JSON content-type header but an
  // empty body -- JSON.parse("") throws, so only parse when there's
  // actually something to parse.
  const body = isJson && text ? JSON.parse(text) : null;
  if (!resp.ok) {
    const error = new Error(body?.detail || resp.statusText);
    error.status = resp.status;
    throw error;
  }
  return body;
}

function setMsg(el, text, kind) {
  el.className = kind || "";
  el.innerHTML = kind === "" && text ? `<span class="spinner"></span>${text}` : text;
}

$("lang-toggle").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem("hawkeye-lang", lang);
  applyStaticI18n();
  renderLogEmpty();
  loadConfigList();
  loadHistory();
});

function setSettingsCollapsed(collapsed) {
  $("settings-toggle").classList.toggle("collapsed", collapsed);
  $("settings-toggle").setAttribute("aria-expanded", String(!collapsed));
  $("settings-body").classList.toggle("collapsed", collapsed);
}
setSettingsCollapsed(localStorage.getItem("hawkeye-settings-collapsed") === "1");
const toggleSettings = () => {
  const collapsed = !$("settings-body").classList.contains("collapsed");
  setSettingsCollapsed(collapsed);
  localStorage.setItem("hawkeye-settings-collapsed", collapsed ? "1" : "0");
};
$("settings-toggle").addEventListener("click", toggleSettings);
$("settings-toggle").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleSettings(); }

const dropzone = $("dropzone");

    });

    // Configuring a scan ends here: it becomes a row in the history list and

function openScanRow(scanId) {
  const row = document.querySelector(`#history-table tr[data-scan-id="${scanId}"]`);
  if (!row) return;
  row.click();
  row.scrollIntoView({ block: "nearest" });
}

function statusLabel(status) {
  return t(`status.${status}`) || status;
}

// The pipeline's on_status calls, in the order scanner/pipeline.py emits
// them. "queued" sits before all of these and "done"/"failed" after, so
// neither belongs in the list. "translating" is absent because the web
// pipeline passes translate=False -- a step that is always skipped is a
// slot the reader watches stay grey for the whole scan. The status label
// is kept in the i18n table for the CLI path, which still translates.
const PIPELINE_STEPS = ["ingesting", "scanning", "indexing", "verifying", "reporting"];

// Roughly each stage's share of a scan's wall clock, used to collapse "which
// stage, how far into it" into the single number the bar draws. Only
// `verifying` reports counts, so the others contribute half their slice
// while running and all of it once passed -- the stepper above the bar stays
// the honest answer to where the scan is, the bar just has to move.
const STEP_WEIGHTS = { ingesting: 3, scanning: 30, indexing: 5, verifying: 57, reporting: 5 };
const TOTAL_WEIGHT = Object.values(STEP_WEIGHTS).reduce((a, b) => a + b, 0);

let lastActiveStep = -1;
let elapsedTimer = null;
let scanRunning = false;

function formatClock(ms) {
  const total = Math.floor(ms / 1000);
  return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
}

function overallFraction(status, progress) {
  if (status === "done") return 1;
  const idx = PIPELINE_STEPS.indexOf(status);
  if (idx < 0) return 0;
  const passed = PIPELINE_STEPS.slice(0, idx).reduce((sum, step) => sum + STEP_WEIGHTS[step], 0);
  const within = progress && progress.total > 0 ? progress.done / progress.total : 0.5;
  return (passed + STEP_WEIGHTS[PIPELINE_STEPS[idx]] * within) / TOTAL_WEIGHT;
}

// Extrapolated from the counted stage only, not from the whole scan: the
// stages around it report nothing, so pretending to know their remaining
// time would be inventing a number. Held back until a few items have landed
// -- with several verify calls in flight the first ones finish together and
// an estimate off those alone swings wildly.
function etaClock(progress) {
  if (!progress || progress.total <= 0 || progress.done < 3 || !progress.elapsed) return null;
  const remaining = (progress.elapsed / progress.done) * (progress.total - progress.done);
  return formatClock(remaining * 1000);
}

function renderStageMeta(status, progress) {
  const countEl = $("step-count");
  const etaEl = $("step-eta");
  if (!countEl || !etaEl) return;
  const counting = progress && progress.total > 0 && status !== "done" && status !== "failed";
  countEl.textContent = counting ? t("progress.count")(progress.done, progress.total) : "";
  const clock = counting ? etaClock(progress) : null;
  etaEl.textContent = counting ? (clock ? t("progress.eta")(clock) : t("progress.etaUnknown")) : "";
}

function renderProgress(status, progress) {
  const bar = $("pbar-fill");
  if (bar) {
    bar.style.width = `${Math.round(overallFraction(status, progress) * 100)}%`;
    bar.classList.toggle("done", status === "done");
    bar.classList.toggle("failed", status === "failed");
  }
  renderStageMeta(status, progress);

  const idx = PIPELINE_STEPS.indexOf(status);
  // Remembered because "failed" does not say which stage failed -- the last
  // stage we saw running is the one that did.
  if (idx >= 0) lastActiveStep = idx;
  const isDone = status === "done";
  const isFailed = status === "failed";

  // State comes from position relative to the current step, not from a flag
  // per step: a run can skip `translating` (pipeline.py only calls it when
  // the report needs another language), and a skipped stage should read as
  // finished rather than sit there looking stuck.
  $("stepper").innerHTML = PIPELINE_STEPS.map((step, i) => {
    let state = "";
    if (isDone || i < lastActiveStep) state = "done";
    else if (i === lastActiveStep) state = isFailed ? "failed" : "active";
    const mark = state === "done" || state === "failed" ? "" : String(i + 1);
    return `<div class="pstep ${state}"><div class="pstep-dot">${mark}</div>`
      + `<div class="pstep-label">${t(`progress.steps.${step}`)}</div></div>`;
  }).join("");
}

function startElapsed(startedAtIso) {
  // Anchored to the scan's own start time when the server knows it, so a
  // task opened from the history list shows how long it has really been
  // running rather than how long this panel has been on screen.
  const parsed = startedAtIso ? Date.parse(asUtc(startedAtIso)) : NaN;
  const startedAt = isNaN(parsed) ? Date.now() : parsed;
  stopElapsed();
  const tick = () => {
    const el = $("step-elapsed");
    if (el) el.textContent = t("progress.elapsed")(formatClock(Date.now() - startedAt));
  };
  tick();
  elapsedTimer = setInterval(tick, 1000);
}

function stopElapsed() {
  if (elapsedTimer) clearInterval(elapsedTimer);
  elapsedTimer = null;
}

// The progress panel and this task's own log, rendered into the detail area
// under the history row. A running scan is a row in the list like any other
// -- there is no separate "current scan" place on the page for it to be.
function taskProgressHtml() {
  return `<div class="stepper" id="stepper"></div>`
    + `<div class="pbar"><div class="pbar-fill" id="pbar-fill"></div></div>`
    + `<div class="pstep-meta">`
    + `<span class="pstep-elapsed" id="step-elapsed"></span>`
    + `<span class="pstep-elapsed" id="step-count"></span>`
    + `<span class="pstep-elapsed" id="step-eta"></span>`
    + `</div>`
    + `<div class="task-log" id="task-log">`
    + `<div class="task-log-head" id="task-log-toggle" role="button" tabindex="0" aria-expanded="true">`
    + `<span>${t("logs.taskHeading")}</span><span class="chevron" aria-hidden="true"></span>`
    + `</div>`
    + `<pre id="log-body"></pre>`
    + `</div>`;
}

function beginTaskProgress(scan) {
  lastActiveStep = -1;
  $("detail-body").innerHTML = taskProgressHtml();
  $("task-log-toggle").addEventListener("click", toggleTaskLog);
  $("task-log-toggle").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleTaskLog(); }
  });
  setTaskLogCollapsed(localStorage.getItem("hawkeye-task-log-collapsed") === "1");
  renderProgress(scan.status, null);
  startElapsed(scan.started_at);
  watchTaskLog(scan.id);
}

function scanProgress(scan) {
  return { done: scan.stage_done ?? 0, total: scan.stage_total ?? 0, elapsed: scan.stage_elapsed ?? 0 };
}

// One poller at a time. Selecting another row replaces the token, and the
// loop that owned the old one returns instead of writing its status into a
// panel that is now showing someone else's task.
let activeScanPoll = null;

async function pollScanTask(project, scan) {
  const token = {};
  activeScanPoll = token;
  let current = scan;
  scanRunning = true;
  ensureLogPolling();

  while (activeScanPoll === token) {
    renderProgress(current.status, scanProgress(current));
    updateHistoryRow(current);

    if (current.status === "done" || current.status === "failed") {
      scanRunning = false;
      stopElapsed();
      ensureLogPolling();
      if (activeScanPoll === token) await renderScanDetail(project, current);
      return;
    }

    await new Promise((r) => setTimeout(r, 2000));
    if (activeScanPoll !== token) return;
    try {
      current = await api(`/scans/${scan.id}`);
    } catch (e) {
      // The server going away mid-scan is already reported by every other
      // request on the page; retrying forever here would only add noise.
      scanRunning = false;
      stopElapsed();
      return;
    }
  }
}

function updateHistoryRow(scan) {
  const row = document.querySelector(`#history-table tr[data-scan-id="${scan.id}"]`);
  if (!row) return;
  const cls = scan.status === "done" ? "pill-done" : scan.status === "failed" ? "pill-failed" : "pill-progress";
  row.children[1].innerHTML = `<span class="pill ${cls}">${statusLabel(scan.status)}</span>`;
  const title = $("detail-title");
  if (row.classList.contains("selected") && title) {
    title.textContent = `${title.textContent.split(" — ")[0]} — ${statusLabel(scan.status)}`;
  }
}
function asUtc(iso) {
  // The API serialises datetimes from naive UTC values, so they arrive with
  // no offset -- and new Date() reads an offset-less string as *local* time,
  // which silently shifts every timestamp by the viewer's own zone (8 hours
  // here). Mark it as UTC unless it already says otherwise.
  return /(Z|[+-]\d{2}:?\d{2})$/.test(iso) ? iso : iso + "Z";
}

function localTime(iso) {
  if (!iso) return "";
  const parsed = new Date(asUtc(iso));
  if (isNaN(parsed.getTime())) return iso;
  return parsed.toLocaleString(lang === "zh" ? "zh-CN" : "en-US", {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  });
}

async function loadHistory() {
  const tbody = document.querySelector("#history-table tbody");
  tbody.innerHTML = "";
  $("scan-detail").style.display = "none";
  const projects = await api("/projects");
  const rows = [];
  for (const project of projects) {
    const scans = await api(`/projects/${project.id}/scans`);
    for (const scan of scans) rows.push({ project, scan });
  }
  if (rows.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="5">${t("history.empty")}</td></tr>`;
    return;
  }
  for (const { project, scan } of rows) {
    const tr = document.createElement("tr");
    tr.dataset.scanId = scan.id;
    const pillClass = scan.status === "done" ? "pill-done" : scan.status === "failed" ? "pill-failed" : "pill-progress";
    const statusPill = `<span class="pill ${pillClass}">${statusLabel(scan.status)}</span>`;
    tr.innerHTML = `<td>${esc(project.name)}</td><td>${statusPill}</td><td title="${esc(scan.started_at ?? "")}">${esc(localTime(scan.started_at))}</td><td>${t("history.view")}</td>`
      + `<td><button class="small danger-btn" data-delete-scan="${scan.id}">${t("history.delete")}</button></td>`;
    tr.addEventListener("click", () => selectScan(tr, project, scan));
    tr.querySelector("[data-delete-scan]").addEventListener("click", (ev) => {
      // Without this the row's own click handler also fires and opens the
      // detail panel for the scan being deleted.
      ev.stopPropagation();
      deleteScan(project, scan);
    });
    tbody.appendChild(tr);
  }
}

async function deleteScan(project, scan) {
  if (!confirm(t("history.confirmDelete")(project.name))) return;
  try {
    await api(`/scans/${scan.id}`, { method: "DELETE" });
    setMsg($("history-msg"), "", "");
    loadHistory();
  } catch (e) {
    setMsg($("history-msg"), t("history.deleteFail")(e.message), "err");
  }
}

function esc(s) {
  // Rule messages/paths are trusted, but LLM `reasoning`/`exploit_scenario`
  // text can echo back snippets of the scanned (untrusted) source code, so
  // everything from a finding gets escaped before going into innerHTML.
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// Reports rendered before findings carried a CVSS score fall back to the
// engine's own severity, which is what they were graded by at the time.
function riskPill(item) {
  if (item.risk_level == null || item.cvss_score == null) {
    return `<span>${esc(item.severity ?? "")}</span>`;
  }
  const vector = esc(item.cvss_vector ?? "");
  return `<span class="pill risk-${esc(item.risk_level)}" title="${vector}">${t(`risk.${item.risk_level}`)}</span>`
    + `<span class="cvss" title="${vector}">CVSS ${item.cvss_score.toFixed(1)}</span>`;
}

function findingCardHtml(item) {
  const finding = item.finding || {};
  const reachable = finding.reachable || "uncertain";
  const isFailed = (finding.reasoning || "").includes("verifier_failed");
  const bucket = isFailed ? "failed" : reachable;
  const badgeClass = isFailed ? "badge-failed" : { yes: "badge-yes", no: "badge-no" }[reachable] || "badge-uncertain";
  const badgeLabel = isFailed ? t("reachable.failed") : (t(`reachable.${reachable}`) || reachable);
  const ruleIds = (item.rule_ids || [item.rule_id || ""]).join(", ");
  const messages = (item.messages || [item.message || ""]).join(" / ");
  // Both languages of an LLM field, swapped by applyStaticI18n() the same
  // way the report page does it. Falls back to the single original when
  // 04_translate.py has not run for this scan.
  const bilingual = (field) => {
    const original = finding[field] || "";
    if (!original) return "";
    const zh = finding[`${field}_zh`] || original;
    const en = finding[`${field}_en`] || original;
    return `<span data-text-zh="${esc(zh)}" data-text-en="${esc(en)}">${esc(lang === "zh" ? zh : en)}</span>`;
  };
  const exploit = finding.exploit_scenario
    ? `<p><strong>${t("card.exploit")}</strong> ${bilingual("exploit_scenario")}</p>` : "";
  const remediation = finding.remediation
    ? `<p class="remediation"><strong>${t("card.remediation")}</strong> ${bilingual("remediation")}</p>` : "";
  const confidence = finding.confidence != null
    ? `<p><strong>${t("card.confidence")}</strong> ${esc(finding.confidence)}</p>` : "";
  return `
    <details class="finding-card" data-bucket="${esc(bucket)}">
      <summary>
        <span class="badge ${badgeClass}">${badgeLabel}</span>
        ${riskPill(item)}
        <span class="finding-location">${esc(item.sink_file)}:${esc(item.sink_line)}</span>
        <span class="finding-rule">${esc(ruleIds)}</span>
      </summary>
      <div class="card-body">
        <p><strong>${t("card.rule")}</strong> ${esc(messages)}</p>
        <p><strong>CWE:</strong> ${esc(item.cwe || "-")} &nbsp;·&nbsp; <strong>${t("card.source")}</strong> ${esc(item.source_file)}:${esc(item.source_line)}</p>
        ${confidence}
        <p><strong>${t("card.reasoning")}</strong> ${bilingual("reasoning")}</p>
        ${exploit}
        ${remediation}
      </div>
    </details>`;
}

function setExportLinks(scanId, mdId, htmlId) {
  $(mdId).href = `/scans/${scanId}/export?format=md&lang=${lang}`;
  $(htmlId).href = `/scans/${scanId}/export?format=html`;
}

async function selectScan(tr, project, scan) {
  document.querySelectorAll("#history-table tr.selected").forEach((el) => el.classList.remove("selected"));
  tr.classList.add("selected");

  // Whatever the previously selected task was doing stops here: its poller
  // checks the token, its clock is ours to restart, and its log lines are
  // not this task's.
  activeScanPoll = null;
  stopElapsed();
  stopLogPolling();

  $("scan-detail").style.display = "block";
  $("detail-title").textContent = `${project.name} — ${statusLabel(scan.status)}`;

  if (scan.status !== "done" && scan.status !== "failed") {
    $("detail-actions-wrap").style.display = "none";
    beginTaskProgress(scan);
    pollScanTask(project, scan);
    return;
  }
  await renderScanDetail(project, scan);
}

async function renderScanDetail(project, scan) {
  const title = $("detail-title");
  const openLink = $("detail-open-link");
  const body = $("detail-body");
  title.textContent = `${project.name} — ${statusLabel(scan.status)}`;

  if (scan.status === "failed") {
    $("detail-actions-wrap").style.display = "none";
    body.innerHTML = `<p class="err" style="font-size:0.85rem">${esc(scan.error_message ? localizeError(scan.error_message) : t("detail.failedNoInfo"))}</p>`;
    return;
  }

  $("detail-actions-wrap").style.display = "flex";
  openLink.href = `/scans/${scan.id}/report.html`;
  setExportLinks(scan.id, "detail-export-md", "detail-export-html");
  body.innerHTML = `<p style="font-size:0.85rem;color:var(--text-muted)"><span class="spinner"></span> ${t("detail.loading")}</p>`;
  try {
    const report = await api(`/scans/${scan.id}/report.json`);
    const s = report.summary;
    const needsReview = s.uncertain + s.verifier_failed;
    const statHtml = [
      [s.reachable, "stats.reachable", "stat-yes"],
      [s.not_reachable, "stats.safe", "stat-no"],
      [needsReview, "stats.needsReview", "stat-uncertain"],
    ].map(([value, labelKey, cls]) => `<span class="stat-mini ${cls}"><b>${value}</b>${t(labelKey)}</span>`).join("");
    const filterHtml = ["all", "yes", "no", "uncertain", "failed"].map((key, i) =>
      `<button class="filter-btn${i === 0 ? " active" : ""}" data-filter="${key}">${t(`filters.${key}`)}</button>`).join("");
    const cardsHtml = report.findings.length
      ? report.findings.map(findingCardHtml).join("")
      : `<p style="font-size:0.85rem;color:var(--text-faint)">${t("detail.noFindings")}</p>`;
    body.innerHTML = `
      <div class="detail-summary">${statHtml}</div>
      <div class="filters">${filterHtml}</div>
      <div id="detail-cards">${cardsHtml}</div>`;

    const cards = Array.from(body.querySelectorAll(".finding-card"));
    body.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        body.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        cards.forEach((card) => {
          const show = btn.dataset.filter === "all" || card.dataset.bucket === btn.dataset.filter;
          if (show) card.removeAttribute("data-hidden"); else card.setAttribute("data-hidden", "");
        });
      });
    });
  } catch (e) {
    body.innerHTML = `<p class="err" style="font-size:0.85rem">${t("detail.loadFailed")(e.message)}</p>`;
  }
}

// ---- the selected task's log -------------------------------------------
// The server's output, filtered to the scan whose row is open: GET /logs
// tags each line with the scan that was running when it was printed.
const LOG_POLL_MS = 1500;
const LOG_MAX_LINES = 2000;
let logSeq = 0;
let logTimer = null;
let logScanId = null;
// Set once the server has been asked to stop, so nothing restarts a timer
// against a process that is on its way out.
let serverStopped = false;

function taskLogCollapsed() {
  const box = $("task-log");
  return box === null || box.classList.contains("collapsed");
}

function setTaskLogCollapsed(collapsed) {
  const box = $("task-log");
  if (box === null) return;
  box.classList.toggle("collapsed", collapsed);
  $("task-log-toggle").classList.toggle("collapsed", collapsed);
  $("task-log-toggle").setAttribute("aria-expanded", String(!collapsed));
  ensureLogPolling();
}

const toggleTaskLog = () => {
  const collapsed = !taskLogCollapsed();
  setTaskLogCollapsed(collapsed);
  localStorage.setItem("hawkeye-task-log-collapsed", collapsed ? "1" : "0");
};

function watchTaskLog(scanId) {
  logScanId = scanId;
  logSeq = 0;
  const box = $("log-body");
  if (box) box.innerHTML = "";
  renderLogEmpty();
  ensureLogPolling();
}

function stopLogPolling() {
  if (logTimer !== null) { clearInterval(logTimer); logTimer = null; }
  logScanId = null;
}

function renderLogEmpty() {
  const box = $("log-body");
  if (box && !box.childElementCount) box.innerHTML = `<span class="log-empty">${t("logs.empty")}</span>`;
}

function appendLogLines(lines) {
  const box = $("log-body");
  if (!box) return;
  const placeholder = box.querySelector(".log-empty");
  if (placeholder) placeholder.remove();
  // Measured before the write, because appending is what makes the two
  // numbers differ -- read it afterwards and the view is never "at the
  // bottom" and never follows.
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
  for (const line of lines) {
    const el = document.createElement("div");
    el.textContent = line;
    box.appendChild(el);
  }
  while (box.childElementCount > LOG_MAX_LINES) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

async function pollLogs() {
  if (logScanId === null) return;
  try {
    const data = await api(`/logs?after=${logSeq}&scan_id=${encodeURIComponent(logScanId)}`);
    logSeq = data.next;
    if (data.entries.length) appendLogLines(data.entries.map((e) => e.text));
    else renderLogEmpty();
  } catch (e) {
    // The panel is a mirror of something that is fine without it; a failed
    // poll is not worth an error message on top of whatever already broke.
  }
}

// Polled only while a task's log is on screen and open, so a page left on
// the history list is not asking the server anything.
function ensureLogPolling() {
  const wanted = !serverStopped && logScanId !== null && !taskLogCollapsed();
  if (wanted && logTimer === null) {
    pollLogs();
    logTimer = setInterval(pollLogs, LOG_POLL_MS);
  } else if (!wanted && logTimer !== null) {
    clearInterval(logTimer);
    logTimer = null;
  }
}
// ---- keeping the server alive only while this page is open -------------
// The server runs detached with no console of its own, so the page is its
// window: while one is open it gets a beat, and when the last one goes the
// server stops on its own.
const HEARTBEAT_MS = 3000;
let heartbeatTimer = null;

async function sendHeartbeat() {
  if (serverStopped) return;
  try {
    const beat = await api("/heartbeat", { method: "POST" });
    // The server is the authority on this: the page only polls the task
    // whose row is open, so its own view goes stale the moment another row
    // is selected.
    scanRunning = beat.scan_running === true;
  } catch (e) {
    // A missed beat is not worth reporting: the watchdog tolerates several,
    // and if the server really is gone every other request says so louder.
  }
}

sendHeartbeat();
heartbeatTimer = setInterval(sendHeartbeat, HEARTBEAT_MS);

// pagehide rather than unload: it is the one that fires reliably when a tab
// is closed, and the only one that fires at all on a page the browser has
// frozen or moved into its back/forward cache. sendBeacon because a normal
// fetch started here is cancelled as the page goes away.
window.addEventListener("pagehide", (event) => {
  // A page going into the back/forward cache can come back and keep beating,
  // so it is not a close.
  if (event.persisted || serverStopped) return;
  navigator.sendBeacon("/page-closing");
});

async function stopServer(force) {
  return api(`/shutdown${force ? "?force=true" : ""}`, { method: "POST" });
}

$("stop-server-btn").addEventListener("click", async () => {
  const msg = $("server-msg");
  const button = $("stop-server-btn");
  button.disabled = true;
  setMsg(msg, t("logs.stopping"), "");
  try {
    try {
      await stopServer(false);
    } catch (e) {
      // 409 is the server refusing while a scan is in flight. It is the one
      // failure worth turning into a question rather than a message: the
      // page controls this text, which beforeunload's dialog does not allow.
      if (e.status !== 409) throw e;
      if (!confirm(t("logs.stopConfirm"))) {
        button.disabled = false;
        setMsg(msg, "", "");
        return;
      }
      await stopServer(true);
    }
  } catch (e) {
    button.disabled = false;
    setMsg(msg, t("logs.stopFail")(e.message), "err");
    return;
  }
  serverStopped = true;
  scanRunning = false;
  if (heartbeatTimer !== null) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
  stopElapsed();
  ensureLogPolling();
  setMsg(msg, t("logs.stopped"), "ok");
});

// The scan runs inside the server process this page is talking to, so
// leaving mid-scan is worth a confirmation. The text is the browser's own --
// beforeunload has not let a page choose its wording for years -- all this
// controls is whether the prompt appears at all.
window.addEventListener("beforeunload", (e) => {
  if (!scanRunning) return;
  e.preventDefault();
  e.returnValue = "";
});

applyStaticI18n();
renderLogEmpty();
loadActiveConfig();
loadConfigList();
loadHistory();
</script>
</body>
</html>
