<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>sast-local</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 2.5rem; }
  section { border: 1px solid #e2e2e5; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1.2rem; }
  label { display: block; font-size: 0.85rem; color: #444; margin: 0.6rem 0 0.2rem; }
  input, select { width: 100%; padding: 0.4rem 0.5rem; box-sizing: border-box; font-size: 0.9rem; }
  button { margin-top: 0.8rem; padding: 0.45rem 1rem; cursor: pointer; }
  .row { display: flex; gap: 0.6rem; align-items: center; }
  #status-msg, #settings-msg { font-size: 0.85rem; margin-top: 0.5rem; }
  .ok { color: #16803c; }
  .err { color: #d64545; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.6rem; font-size: 0.85rem; }
  td, th { text-align: left; padding: 0.3rem 0.4rem; border-bottom: 1px solid #eee; }
  a.report-link { display: inline-block; margin-top: 0.6rem; }
</style>
</head>
<body>
  <h1>sast-local — 本地代码安全扫描</h1>

  <section>
    <h2 style="margin-top:0">1. 上传 zip 并扫描</h2>
    <input type="file" id="file-input" accept=".zip">
    <button id="upload-btn">上传并开始扫描</button>
    <p id="status-msg"></p>
    <a id="report-link" class="report-link" style="display:none" target="_blank">查看报告 →</a>
  </section>

  <section>
    <h2 style="margin-top:0">历史扫描</h2>
    <table id="history-table">
      <thead><tr><th>项目</th><th>状态</th><th>时间</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2 style="margin-top:0">LLM 供应商设置</h2>
    <label>模板</label>
    <select id="provider-template">
      <option value="">自定义</option>
      <option value="https://api.openai.com/v1">OpenAI</option>
      <option value="https://api.deepseek.com/v1">DeepSeek</option>
      <option value="https://open.bigmodel.cn/api/paas/v4">智谱 GLM</option>
      <option value="https://dashscope.aliyuncs.com/compatible-mode/v1">通义千问(兼容模式)</option>
    </select>
    <label>Base URL</label>
    <input id="base-url" placeholder="留空则使用官方 OpenAI 地址">
    <label>API Key</label>
    <input id="api-key" type="password" placeholder="sk-...">
    <label>复核用模型名</label>
    <input id="verify-model" placeholder="例如 gpt-4o-mini / glm-4-flash / deepseek-chat">
    <div class="row">
      <button id="test-btn">测试连接</button>
      <button id="save-btn">保存</button>
    </div>
    <p id="settings-msg"></p>
  </section>

<script>
const $ = (id) => document.getElementById(id);

async function api(path, options) {
  const resp = await fetch(path, options);
  const isJson = resp.headers.get("content-type")?.includes("application/json");
  const body = isJson ? await resp.json() : null;
  if (!resp.ok) throw new Error(body?.detail || resp.statusText);
  return body;
}

$("provider-template").addEventListener("change", (e) => {
  $("base-url").value = e.target.value;
});

$("test-btn").addEventListener("click", async () => {
  const msg = $("settings-msg");
  msg.textContent = "测试中...";
  msg.className = "";
  try {
    const result = await api("/settings/llm/test", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        base_url: $("base-url").value || null,
        api_key: $("api-key").value,
        verify_model: $("verify-model").value,
      }),
    });
    msg.textContent = result.success ? "连接成功" : `连接失败: ${result.error}`;
    msg.className = result.success ? "ok" : "err";
  } catch (e) {
    msg.textContent = `请求失败: ${e.message}`;
    msg.className = "err";
  }
});

$("save-btn").addEventListener("click", async () => {
  const msg = $("settings-msg");
  try {
    await api("/settings/llm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        base_url: $("base-url").value || null,
        api_key: $("api-key").value,
        verify_model: $("verify-model").value,
      }),
    });
    msg.textContent = "已保存";
    msg.className = "ok";
  } catch (e) {
    msg.textContent = `保存失败: ${e.message}`;
    msg.className = "err";
  }
});

async function loadActiveConfig() {
  try {
    const cfg = await api("/settings/llm");
    if (!cfg) return;
    $("base-url").value = cfg.base_url || "";
    $("verify-model").value = cfg.verify_model || "";
  } catch (e) { /* ignore */ }
}

$("upload-btn").addEventListener("click", async () => {
  const statusMsg = $("status-msg");
  const reportLink = $("report-link");
  reportLink.style.display = "none";
  const file = $("file-input").files[0];
  if (!file) { statusMsg.textContent = "请先选择一个 zip 文件"; statusMsg.className = "err"; return; }

  try {
    statusMsg.textContent = "上传中...";
    statusMsg.className = "";
    const form = new FormData();
    form.append("file", file);
    const project = await api("/uploads", { method: "POST", body: form });

    const scan = await api("/scans", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ project_id: project.id }),
    });

    await pollScan(scan.id, statusMsg, reportLink);
    loadHistory();
  } catch (e) {
    statusMsg.textContent = `失败: ${e.message}`;
    statusMsg.className = "err";
  }
});

async function pollScan(scanId, statusMsg, reportLink) {
  while (true) {
    const scan = await api(`/scans/${scanId}`);
    statusMsg.textContent = `扫描状态: ${scan.status}`;
    statusMsg.className = "";
    if (scan.status === "done") {
      statusMsg.textContent = "扫描完成";
      statusMsg.className = "ok";
      reportLink.href = `/scans/${scanId}/report.html`;
      reportLink.style.display = "inline-block";
      return;
    }
    if (scan.status === "failed") {
      statusMsg.textContent = `扫描失败: ${scan.error_message || ""}`;
      statusMsg.className = "err";
      return;
    }
    await new Promise((r) => setTimeout(r, 2000));
  }
}

async function loadHistory() {
  const tbody = document.querySelector("#history-table tbody");
  tbody.innerHTML = "";
  const projects = await api("/projects");
  for (const project of projects) {
    const scans = await api(`/projects/${project.id}/scans`);
    for (const scan of scans) {
      const tr = document.createElement("tr");
      const link = scan.status === "done" ? `<a href="/scans/${scan.id}/report.html" target="_blank">查看报告</a>` : "";
      tr.innerHTML = `<td>${project.name}</td><td>${scan.status}</td><td>${scan.started_at ?? ""}</td><td>${link}</td>`;
      tbody.appendChild(tr);
    }
  }
}

loadActiveConfig();
loadHistory();
</script>
</body>
</html>
