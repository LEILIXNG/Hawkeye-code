# Default Semgrep rule set for scanner/pipeline.py and scripts/01_scan.py.
#
# Each entry is a path (relative to the repo root) passed to `semgrep
# --config`. Paths under rules/vendor/semgrep-rules/ come from the pinned
# git submodule (see rules/vendor/semgrep-rules, locked to one commit) --
# scanning offline and reproducibly instead of the network-fetched
# `p/java` / `p/security-audit` / `p/owasp-top-ten` registry packs, whose
# contents can silently change upstream between scans.
#
# Selection: every java/**/security/ directory in the vendored repo, i.e.
# the same rules the registry packs above draw from for Java, minus two
# categories judged out of scope for this tool (server-side Java/Spring
# web apps -- see docs/framework.md):
#   - java/android/security    -- mobile-only rules (exported activities, etc.)
#   - java/aws-lambda/security -- serverless-specific taint rules
# Revisit this trim if the tool ever needs to scan Android or Lambda code.
#
# Python (2026-09-11), same selection logic applied to the language: every
# python/**/security directory whose framework scanner/callgraph/ can now
# actually trace reachability through (Flask, Django, FastAPI, Pyramid), the
# library-misuse buckets a server-side app plausibly pulls in regardless of
# web framework (jinja2 -- SSTI, sqlalchemy, jwt, pymongo, boto3, requests,
# sh -- subprocess/shell, cryptography), and python/lang/security for the
# same general-purpose-Python rules java/lang/security covers on the other
# side. cryptography/security's hardening-shaped CWEs (weak hash, broken
# cipher, ...) are filtered by the CWE denylist below exactly like Java's
# equivalent findings already are -- no separate handling needed, the
# denylist reads CWE strings, not languages.
#
# Left out, mirroring the Java android/aws-lambda trim:
#   - python/aws-lambda/security -- serverless-specific
#   - python/airflow/security    -- DAG/orchestration-specific, not a web app
#   - python/docker/security     -- Dockerfile linting, not source code
#   - python/twilio/security     -- one third-party SDK, narrow value
#   - python/attr, bokeh, click, distributed, correctness -- not `security/`
#     directories at all (correctness/maintainability/best-practice rules,
#     out of scope the same way non-security java/ directories already are)
#
# JavaScript/TypeScript (2026-09-11), same logic again: node-crypto,
# jsonwebtoken/jwt-simple/jose/passport-jwt (JWT), sequelize (ORM/SQLi),
# shelljs (command injection), sax/xml2json/node-expat (XML/XXE),
# serialize-javascript (insecure deserialization), vm2/sandbox (code-eval
# sandbox escapes -- a server-side risk, not a client one), grpc, ajv
# (JSON-schema validation bypass), apollo (GraphQL), argon2/bluebird/thenify,
# javascript/lang/security and typescript/lang/security for the
# general-purpose rules, and typescript/nestjs/security for Nest's own
# decorator-shaped findings scanner/callgraph/js_entrypoints.py can now
# trace reachability through.
#
# Left out, browser/client-only or infra, not this tool's server-side scope:
#   - javascript/browser, jquery, monaco-editor, playwright, puppeteer,
#     chrome-remote-interface, phantom -- runs in a browser or drives one,
#     not server-side application code
#   - javascript/angular, vue, typescript/angular, typescript/react --
#     client-side UI frameworks
#   - javascript/fbjs, intercom, wkhtmltoimage, wkhtmltopdf -- narrow
#     third-party integrations, low value the same way python/twilio was
#   - javascript/aws-lambda, typescript/aws-cdk -- serverless/infra,
#     mirrors python/java's aws-lambda exclusion
#   - javascript/deno -- a different runtime with its own entry-point
#     shapes scanner/callgraph/js_entrypoints.py does not recognise yet
#
# Go (2026-09-14): unlike Java/Python/JS, the vendored rules for this
# language are not split into one directory per web framework at all --
# almost everything security-relevant lives in go/lang/security regardless
# of whether the code is net/http, gin, echo or plain library use, because
# semgrep-rules simply does not carry separate gin/echo/chi rule packs the
# way it does spring/flask/express ones. So the selection here is close to
# "every go/*/security directory", trimmed the same one way every other
# language's selection is:
#   - go/aws-lambda/security -- serverless-specific, mirrors the
#     java/python/javascript aws-lambda exclusion
# Kept, unlike the trimmed-out frameworks above: go/otto/security (an
# embedded JS interpreter -- arbitrary code execution is a server-side risk
# here the same way javascript/vm2 and javascript/sandbox were kept for
# JS), go/gorilla/security (mux/sessions, mostly cookie-hardening CWEs the
# out_of_scope_cwes denylist below already filters -- kept for the same
# reason java/mongodb/security is, a framework-specific bucket costs
# nothing to include once the CWE filter exists), go/gorm/security (ORM
# misuse, dataflow-shaped like java/mongodb's), go/grpc/security (mirrors
# javascript/grpc), go/jwt-go/security (mirrors java-jwt/jjwt/python's jwt),
# go/template/security (html/template SSTI -- Go's counterpart to Java's
# SpEL and Python's jinja2 template-injection coverage).
#
# Rust (2026-09-17, rule library; call graph added the same day). Vendored
# rust rules are much thinner than Java/Python/JS/Go's: the submodule
# carries exactly one directory, rust/lang/security, with no
# framework-specific packs at all (no actix-web, rocket, sqlx or diesel
# equivalent of spring/flask/gorm). Of its nine rules, four are already
# handled by the existing out_of_scope_cwes denylist below with no
# Rust-specific change needed: ssl-verify-none, rustls-dangerous and
# reqwest-accept-invalid are all CWE-295 (disabled TLS verification), and
# insecure-hashes is CWE-328 (weak hash) -- both already listed. The
# remaining five (args, args-os, current-exe, temp-dir: CWE-807; unsafe-
# usage: CWE-242; reqwest-set-sensitive: CWE-921) are kept, mirroring how
# every other language's similarly hardening-shaped bucket is kept once the
# CWE filter exists rather than trimmed by hand (see python/cryptography
# above).
#
# None of the nine vendored rules is an injection-shaped source -> sink
# rule -- the gap this project's own rules/custom/java and rules/custom/
# python fill for their languages with command-injection.yml and
# sql-string-formatting.yml. rules/custom/rust/ adds the Rust equivalents:
# command injection via std::process::Command invoking a shell (sh/bash/cmd)
# with a non-constant argument, and SQL built by string formatting
# (format!, or a "...".to_string() / String::from("...") concatenation)
# containing a SQL keyword.
#
# scanner/callgraph/rust_syntax.py / rust_entrypoints.py / rust_index.py
# give these candidates the same cross-function reachability tracing every
# other language here gets: actix-web and Rocket handlers are recognised by
# their attribute macro (#[get("/x")]), axum and actix's builder style by
# their route-registration call (.route(path, get(handler)), .route(path,
# web::get().to(handler))). See scanner/callgraph/__init__.py's own Rust
# paragraph for what is structurally different about how Rust's ownership
# and trait-supertype relationships get read.
#
# C# (2026-09-17, rule library; call graph added the same day). Unlike
# Rust, the vendored csharp rules are close to Java's own depth:
# csharp/lang/security (with its nested ad, cryptography, filesystem, http,
# injections, insecure-deserialization, memory, regular-expression-dos,
# sqli, ssrf and xxe subdirectories -- one directory config here sweeps up
# every rule file semgrep finds underneath it, the same way the single
# java/lang/security entry above already pulls in that language's own
# nested audit/ subdirectory) carries genuine source -> sink coverage this
# project has no custom-rule gap for yet: os-command-injection, csharp-sqli,
# ssrf, three xxe rules, unsafe-path-combine (path traversal), ten separate
# insecure-deserialization rules (BinaryFormatter, NetDataContract,
# LosFormatter, SoapFormatter, JavaScriptSerializer, Json.NET TypeNameHandling
# and others), ldap-injection and xpath-injection, mass-assignment and
# missing-or-broken-authorization. csharp/dotnet/security (ASP.NET-specific:
# missing anti-forgery tokens, debug/trace left enabled, Razor template
# injection, weak crypto/RNG choices) and csharp/razor/security (html-raw-json,
# a Razor-specific XSS shape) round it out. No rules/custom/csharp/ addition
# was needed for this pass -- revisit if a real corpus turns up a gap the
# way MediChain did for Python's sql-string-formatting.yml.
#
# csharp/lang/best-practice and csharp/lang/correctness are left out,
# mirroring every other language's selection logic: only `security/`
# directories are in scope, non-security correctness/best-practice rules
# are not (see the Java selection note at the top of this file).
#
# scanner/callgraph/csharp_syntax.py / csharp_entrypoints.py / csharp_index.py
# give these candidates the same cross-function reachability tracing every
# other language here gets: an HTTP-verb/Route attribute on the method is
# proof (ASP.NET Core attribute routing); a public method with no such
# attribute on a type whose base list includes Controller/ControllerBase is
# proof too (MVC's convention routing); minimal-API registration
# (app.MapGet("/x", handler)) is resolved the same way Go/Rust resolve a
# named handler reference or index an inline lambda at the call site. See
# scanner/callgraph/__init__.py's own C# paragraph for what is structurally
# different about how a partial class's scattered base-list declarations
# get read.

# Rules that fire often enough to be a real drag on a scan but have never
# produced a true finding on this project's targets. Each id is passed to
# semgrep as --exclude-rule, so the rule never runs at all -- nothing
# downstream sees it, and it costs no verify call.
#
# What an excluded rule actually saves depends on the provider. On a paid
# endpoint it is money; on the free-tier endpoints this project is normally
# pointed at it is wall-clock time and, more importantly, rate-limit budget
# -- free models tend to throttle (HTTP 429), and the more candidates a
# scan carries the likelier it is to hit that mid-run. Either way it also
# saves the human time spent dismissing the same false positive in every
# report.
#
# Use the id exactly as it appears in scan output: because the configs
# below are local directories, semgrep derives each rule's id from its path
# (rules.vendor.semgrep-rules.java.spring.security.unrestricted-request-
# mapping), not from the `id:` written inside the YAML. --exclude-rule
# matches that string literally, so a wrong or shortened id silently
# excludes nothing.
#
# Only add an id here with evidence: run `python scripts/rule_stats.py`
# over the accumulated reports and quote the numbers in the commit message.
# Note that verdicts come from the LLM verify stage, so "all of this rule's
# findings came back not-reachable" is evidence, not proof -- prefer
# excluding rules whose matches are structurally irrelevant to this tool's
# scope (see docs/framework.md) over ones the model merely disagreed with.
#
# Measured 2026-08-29 over two projects (126 verified candidates: 72 from a
# real 13-module Maven app, 54 from VulnerableApp) and nothing qualified.
# Every rule that never produced a reachable finding fired 1-3 times, which
# is below the level where excluding it saves anything; the one high-volume
# candidate, unrestricted-request-mapping (15 hits, 14 not-reachable), has a
# reachable finding it is the *only* rule to hit, so excluding it would trade
# noise for a false negative. Re-run scripts/rule_stats.py --noise-clusters
# on the next new corpus rather than re-deriving this.
exclude_rules: []

# Scope. This tool reports a weakness only when there is a complete
# source -> sink path: externally controlled data reaching a dangerous
# operation. That is the whole shape of the pipeline -- semgrep proposes a
# sink, scanner/callgraph.py reconstructs how a request reaches it, and the
# verify stage judges the flow. A rule whose match is a *static property of
# the code* -- a weak hash, a missing cookie flag, a certificate check that
# was disabled -- has no source and no path, so the verify stage has nothing
# to judge and answers the question it was not asked. Measured: the same
# empty checkServerTrusted() came back "not reachable" in one run and
# "reachable, because the untrusted input is the peer's certificate" in the
# next. Both readings are defensible, which is exactly why such findings do
# not belong in a report whose column heading is reachability.
#
# These are real weaknesses; they are out of *this tool's* scope, not
# harmless. A dedicated hardening/config checker is the right home for them.
#
# Listed by CWE rather than by rule id on purpose: scope is a property of
# the weakness, not of any one rule. A vendor rule nobody here has ever seen
# is classified the moment it fires, with no list to update -- and the
# vendored ruleset is far larger than the handful of rules any one corpus
# exercises.
#
# A denylist, not an allowlist, for the same reason exclude_paths is
# conservative: a CWE nobody has classified stays in the scan. A false
# negative costs more than a false positive.
#
# Filtering happens on candidates rather than via --exclude-rule because the
# CWE is on the finding, not derivable from the rule's path. Semgrep still
# runs these rules; what is saved is the verify call and the report row,
# which is where the cost actually is (~5.9s per candidate, plus rate-limit
# budget on the free-tier endpoints).
#
# Custom rules with metadata.hawkeye_verification: static are the explicit
# exception: their deterministic post-validator has already proved the code
# property, so scanner/pipeline.py keeps them without asking the request-
# reachability LLM a question that does not apply.
out_of_scope_cwes:
  - CWE-295    # improper certificate validation (empty TrustManager, HostnameVerifier)
  - CWE-297    # improper validation of certificate with host mismatch
  - CWE-311    # missing encryption of sensitive data
  - CWE-319    # cleartext transmission
  - CWE-326    # inadequate encryption strength (weak SSL context, small keys)
  - CWE-327    # broken or risky crypto algorithm (ECB, DES)
  - CWE-328    # weak hash (MD5, SHA1)
  - CWE-329    # missing/predictable IV
  - CWE-330    # insufficiently random values
  - CWE-338    # cryptographically weak PRNG
  - CWE-347    # improper verification of cryptographic signature
  - CWE-352    # CSRF (a mapping without a method restriction)
  - CWE-614    # cookie without the Secure flag
  - CWE-1004   # cookie without the HttpOnly flag
  - CWE-1275   # cookie with an improper SameSite attribute

# Paths never worth scanning, whatever the target is. Each entry is passed
# to semgrep as --exclude, which takes gitignore-style globs.
#
# This matters because the tool scans whatever zip a user uploads: a real
# project's archive carries its build output, its vendored dependencies and
# its generated sources alongside the actual source, and findings in those
# say nothing about whether the project is vulnerable. They do cost verify
# calls and human attention (see the exclude_rules note above).
#
# Semgrep already skips some of these on its own -- measured against 1.173.0,
# it ignores build/, dist/, node_modules/, vendor/, .venv/, test/, tests/ and
# src/test/ without being asked. Everything below is a *gap* in that default,
# so keep new entries to things actually verified to be scanned otherwise;
# a redundant entry is harmless but misleads the next reader into thinking
# it is doing work.
#
# How these are matched, measured against the pinned 1.173.0 rather than
# assumed -- an earlier version of this note had it backwards:
#   - semgrep matches a bare name (`target`) against a path segment at any
#     depth, including moduleA/target;
#   - a pattern containing a slash it anchors to the scan root, and a
#     leading `**/` does not lift that -- `**/src/it` matches nothing at
#     all. Anchoring is useless here anyway, because an ingested zip puts
#     the project one or more levels below the scan root.
# So the entries below are applied twice: passed to semgrep as --exclude,
# which is what saves the scan time, and enforced again in
# scanner/core.py:drop_excluded_paths, which is what makes an entry with a
# slash in it mean anything. Both treat a glob as a run of consecutive path
# segments, so write `src/it`, not `**/src/it`.
# Keep this list to build output, dependencies, generated code and test
# trees. Directories that merely look unimportant (docs/, examples/) hold
# real source and belong in the scan -- a false negative is worse than the
# false positive it saves. Nothing target-specific goes here either: this
# file ships with the tool, not with any one project.
exclude_paths:
  - target                    # Maven build output
  - out                       # Gradle / IDE build output
  - .gradle                   # Gradle caches and generated scripts
  - gen                       # generated sources
  - generated
  - venv                      # semgrep's default covers .venv but not venv
  - third_party               # vendored dependency source
  - external
  - testdata                  # test fixtures (Go convention, used elsewhere too)
  - src/it                    # Maven failsafe integration tests
  - src/integrationTest       # Gradle integration tests
  - "*.min.js"                # minified bundles: unreadable and not the source
  - "*_test.go"                # Go's own test-file convention: lives beside the
                               # source it tests, not under a separate test/ dir,
                               # so the bare `test`/`tests` names above cannot
                               # catch it the way they catch every other language
  - bin                       # .NET build output (also common enough elsewhere
                               # to be worth the bare name)
  - obj                       # .NET's own intermediate-build directory, always
                               # paired with bin
  - packages                  # pre-PackageReference .NET Framework's vendored
                               # NuGet restore directory (semgrep's own default
                               # already covers node_modules; this is C#'s
                               # equivalent gap)

# PHP (2026-09-17, rule library; call graph added the same day). Unlike
# Rust's near-empty bucket, PHP's vendored coverage is close to C#'s own
# depth: php/lang/security carries genuine source -> sink rules this
# project has no custom-rule gap for -- tainted-exec (CWE-78/94, mode:
# taint, $_GET/$_POST/$_COOKIE/$_REQUEST into exec/system/passthru/
# shell_exec/backticks), tainted-sql-string (CWE-89, the same four
# superglobals into a manually-built SQL string), file-inclusion (CWE-98,
# LFI/RFI), deserialization/unserialize-use (CWE-502), tainted-callable/
# tainted-object-instantiation (CWE-94/470), tainted-filename (CWE-22) and
# php-ssrf (CWE-918). php/laravel/security adds laravel-sql-injection and
# laravel-api-route-sql-injection (CWE-89, Eloquent/query-builder raw
# clauses) and doctrine's own two dangerous-query rules
# (php/doctrine/security) cover Symfony's ORM the same way. php/symfony/
# security's own audit/ rules round it out (CSRF, permissive CORS, open
# redirect). Verified against a hand-written sample with `semgrep
# --config` before being added here: tainted-sql-string and tainted-exec
# both fire on a $_GET-sourced Laravel controller action.
#
# CWE crossover with the denylist below, the same trim every other
# language already gets rather than hand-picked: curl-ssl-verifypeer-off
# and ftp-use (CWE-319), md5-used-as-password (CWE-327), weak-crypto and
# sha224-hash (CWE-328), openssl-cbc-static-iv (CWE-329),
# symfony-csrf-protection-disabled (CWE-352), and Laravel's own
# cookie-secure/http-only/same-site trio (CWE-614/1004/1275) are all
# filtered with no PHP-specific change needed. No rules/custom/php/
# addition was needed for this pass -- revisit if a real corpus turns up a
# gap the way MediChain did for Python's sql-string-formatting.yml.
#
# php/wordpress-plugins/security is left out: WordPress plugin development
# (admin-ajax hooks, nonces, the WP database API) is a narrow CMS-specific
# surface, not a general server-side PHP app, the same low-value-narrow-
# integration call python/twilio/security and javascript/fbjs/security
# already made.
#
# scanner/callgraph/php_syntax.py / php_entrypoints.py / php_index.py give
# these candidates the same cross-function reachability tracing every
# other language here gets: a `#[Route(...)]` PHP attribute (Symfony's
# modern style, and third-party attribute-routing packages some Laravel
# projects add) or the older `@Route(...)` PHPDoc annotation on a method is
# proof; Laravel's `Route::get('/x', $handler)` facade call is resolved the
# same way Go/Rust/C# resolve a route-registration call, except its named-
# reference search is global rather than same-file, since a Laravel routes
# file and the controller it wires up are almost always different files.
# See scanner/callgraph/__init__.py's own PHP paragraph for what else is
# structurally different (`$this` has no fixed grammar production the way
# every earlier class-based language's own keyword does).

# Ruby (2026-09-17, rule library; call graph added the same day). As deep
# as PHP's and C#'s: ruby/lang/security carries real source -> sink taint
# rules -- dangerous-exec (CWE-94, command injection; its pattern-sources
# include not just params/cookies but *any parameter of the enclosing
# method*, which is what lets scanner/callgraph/ruby_index.py's own
# call-graph reachability tracing matter here at all, the same way custom
# plain-pattern rules do for Rust and PHP's exec-use/doctrine-dbal-
# dangerous-query -- see the fixture files under eval/fixtures/ruby_demo
# for why that distinction was checked directly against semgrep rather
# than assumed), dangerous-open/dangerous-subshell/dangerous-syscall
# (CWE-94), bad-deserialization (CWE-502, YAML/Marshal), file-disclosure
# (CWE-22). ruby/rails/security adds real Rails-specific dataflow:
# tainted-sql-string and check-sql (CWE-89), ruby-pg-sqli (CWE-89, the pg
# gem), avoid-tainted-shell-call (CWE-78), avoid-tainted-http-request
# (CWE-918, SSRF), avoid-tainted-file-access/avoid-render-dynamic-path/
# check-dynamic-render-local-file-include (CWE-22), a dozen XSS rules
# (CWE-79: avoid-raw, avoid-html-safe, avoid-content-tag, ...), two XXE
# rules (CWE-611) and open-redirect coverage (CWE-601). ruby/jwt/security
# rounds out JWT algorithm-confusion and hardcoded-secret findings. No
# rules/custom/ruby/ addition was needed for this pass.
#
# CWE crossover with the denylist below, the same trim every other
# language already gets: force-ssl-false (CWE-311), insufficient-rsa-
# key-size (CWE-326), md5-used-as-password and ruby-jwt-none-alg
# (CWE-327), weak-hashes-md5/weak-hashes-sha1/sha224-hash (CWE-328),
# ssl-mode-no-verify (CWE-295), missing-csrf-protection/rails-skip-
# forgery-protection (CWE-352) and check-cookie-store-session-security-
# attributes (CWE-1004) are all filtered with no Ruby-specific change
# needed.
#
# ruby/aws-lambda/security is left out, mirroring every other language's
# own serverless-specific trim (java/python/javascript/go's aws-lambda
# exclusions).
#
# scanner/callgraph/ruby_syntax.py / ruby_entrypoints.py / ruby_index.py
# give these candidates the same cross-function reachability tracing every
# other language here gets. Rails routing has no annotation/attribute
# tier at all (routes.rb is the only source of truth), so entry points
# come from two routes.rb signals -- a per-verb call (`get '/x', to:
# 'ctrl#action'`) and the `resources :name` RESTful macro, both resolved
# globally across the whole index the same way PHP's Laravel facade
# resolution is -- plus a hint (not proof, unlike C#'s otherwise-identical
# convention-routing tier: Rails does not expose every public controller
# method the way ASP.NET MVC's own convention routing does) for a public
# method on an ApplicationController/ActionController::Base subclass. See
# scanner/callgraph/__init__.py's own Ruby paragraph for the grammar traps
# that shaped this module (visibility-flipping calls, invisible bareword
# calls, `def self.foo`'s distinct node type).

