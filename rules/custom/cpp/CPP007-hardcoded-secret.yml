rules:
  - id: CPP007
    languages: [cpp]
    severity: WARNING
    message: A variable with a sensitive name is assigned a hard-coded string literal.
    metadata:
      name: Hard-coded sensitive information
      description: Detects direct string assignments to password, secret, token, and key variables.
      confidence: MEDIUM
      hawkeye_language: cpp
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
    patterns:
      - pattern-either:
          - pattern: $TYPE $VAR = $VALUE;
          - pattern: $TYPE *$VAR = $VALUE;
          - pattern: $VAR = $VALUE;
      - metavariable-regex:
          metavariable: $VAR
          regex: '(?i)^(?:.*_)?(?:password|passwd|secret|token|api_key|access_key)(?:_.*)?$'
      - metavariable-regex:
          metavariable: $VALUE
          regex: '^(?:u8|u|U|L)?".+"$'
