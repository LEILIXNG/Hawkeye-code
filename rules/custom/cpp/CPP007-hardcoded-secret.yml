rules:
  - id: CPP007
    languages: [cpp]
    severity: WARNING
    message: A variable with a sensitive name is assigned a hard-coded string literal.
    metadata:
      name: Hard-coded sensitive information
      description: Detects literal strings and simple constant propagation into password, secret, token, and key variables.
      confidence: MEDIUM
      hawkeye_language: cpp
      hawkeye_validator: hardcoded-secret
      hawkeye_verification: static
      hawkeye_remediation: Load the secret from a protected secret store or environment variable and keep the value out of source control.
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
    patterns:
      - pattern-either:
          - pattern: $TYPE $VAR = $VALUE;
          - pattern: $TYPE *$VAR = $VALUE;
          - pattern: $VAR = $VALUE;
      - metavariable-regex:
          metavariable: $VAR
          regex: '(?i)^(?:(?:.*(?:->|\.))|(?:.*_))?(?:password|passwd|secret|token|api_key|access_key)(?:_.*)?$'
