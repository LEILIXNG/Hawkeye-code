rules:
  - id: CPP006
    languages: [cpp]
    severity: ERROR
    message: Pointer whose latest known value is null is dereferenced.
    metadata:
      name: Obvious null-pointer dereference
      description: Detects nullptr, NULL, zero and simple alias states before member, raw or indexed dereferences.
      confidence: HIGH
      hawkeye_language: cpp
      hawkeye_validator: null-dereference
      hawkeye_verification: static
      hawkeye_remediation: Check the pointer before dereferencing it or replace nullable ownership with a type that makes the empty state explicit.
      cwe: ["CWE-476: NULL Pointer Dereference"]
    pattern-either:
      - pattern: $PTR->$METHOD(...)
      - pattern: $PTR->$FIELD
      - pattern: "*$PTR"
      - pattern: $PTR[$INDEX]
