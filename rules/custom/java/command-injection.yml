# Catches shell invocation via ProcessBuilder("sh"/"cmd", "-c"/"/c", <concatenated command>).
#
# The public Semgrep registry (p/java, p/security-audit, p/owasp-top-ten)
# has no rule that matches this specific shape -- confirmed against
# VulnerableApp's CommandInjection.java, which none of the three caught.
# GitLab's managed SAST does catch it, via find_sec_bugs.COMMAND_INJECTION-1,
# which is not in the public registry.
#
# This is a plain pattern rule, not `mode: taint`. It's deliberately
# over-inclusive on purpose: this project's job for Semgrep is to surface
# candidates, not to prove reachability -- that's what the context
# extraction + LLM verify stages are for (see docs/framework.md section 3-4).
rules:
  - id: shell-invocation-with-string-concatenation
    languages: [java]
    severity: ERROR
    message: >
      A shell is invoked (sh -c / cmd /c) with a command string built via
      string concatenation. If any part of the concatenated value can be
      influenced by external input, this allows arbitrary command
      execution.
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      source: sast-local/rules/custom
    patterns:
      - pattern-either:
          - pattern: new ProcessBuilder(new String[] {"sh", "-c", $CMD + $VAR})
          - pattern: new ProcessBuilder(new String[] {"cmd", "/c", $CMD + $VAR})
          - pattern: new ProcessBuilder("sh", "-c", $CMD + $VAR)
          - pattern: new ProcessBuilder("cmd", "/c", $CMD + $VAR)
